<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asistente de Calidad de Gas Natural · ENAGÁS</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root {
    --azul: #003D6B;
    --azul-claro: #1F6FB2;
    --gris: #555;
    --bg: #eef2f6;
    --verde: #1e7a34;
    --ambar: #b9770e;
    --rojo: #b02a2a;
    --borde: #d8e0e8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", Calibri, system-ui, sans-serif;
    background: linear-gradient(180deg, #f6f9fc 0%, var(--bg) 100%);
    color: #1b2733;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    background: var(--azul); color: #fff;
    padding: 14px 20px; display: flex; align-items: center; gap: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15); z-index: 2;
  }
  header .logo {
    width: 38px; height: 38px; border-radius: 9px; background: var(--azul-claro);
    display: grid; place-items: center; font-weight: 700; font-size: 18px;
  }
  header h1 { font-size: 17px; margin: 0; line-height: 1.2; }
  header p { font-size: 12px; margin: 2px 0 0; color: #bcd4ea; }
  header .spacer { flex: 1; }
  .badge {
    font-size: 12px; padding: 5px 11px; border-radius: 999px;
    background: rgba(255,255,255,.15); display: inline-flex; align-items: center; gap: 6px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #888; }
  .dot.ia { background: #51d88a; }
  .dot.det { background: #f4c542; }
  .dot.off { background: #ff6b6b; }
  .iconbtn {
    background: rgba(255,255,255,.12); border: 0; color: #fff; cursor: pointer;
    width: 34px; height: 34px; border-radius: 8px; font-size: 16px;
  }
  .iconbtn:hover { background: rgba(255,255,255,.25); }

  #settings {
    display: none; background: #0a3357; color: #cfe0ef; padding: 10px 20px;
    font-size: 13px; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  #settings.open { display: flex; }
  #settings input {
    flex: 1; min-width: 220px; padding: 7px 10px; border-radius: 7px;
    border: 1px solid #205685; background: #06283f; color: #fff; font-size: 13px;
  }
  #settings button {
    background: var(--azul-claro); border: 0; color: #fff; padding: 7px 14px;
    border-radius: 7px; cursor: pointer; font-size: 13px;
  }

  main {
    flex: 1; overflow-y: auto; padding: 22px 16px; display: flex; justify-content: center;
  }
  #chat { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 16px; }

  .msg { display: flex; gap: 10px; max-width: 92%; }
  .msg .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex: 0 0 32px;
    display: grid; place-items: center; font-size: 15px; color: #fff;
  }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.user .avatar { background: var(--azul-claro); }
  .msg.bot .avatar { background: var(--azul); }
  .bubble {
    padding: 12px 15px; border-radius: 14px; line-height: 1.5; font-size: 14.5px;
    box-shadow: 0 1px 3px rgba(0,0,0,.07); overflow-x: auto;
  }
  .msg.user .bubble { background: var(--azul); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: #fff; border: 1px solid var(--borde); border-bottom-left-radius: 4px; }
  .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .bubble th, .bubble td { border: 1px solid var(--borde); padding: 5px 9px; text-align: left; }
  .bubble th { background: #eef4fa; color: var(--azul); }
  .bubble code { background: #f1f4f7; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .bubble p:first-child { margin-top: 0; } .bubble p:last-child { margin-bottom: 0; }
  .modo {
    display: inline-block; margin-top: 7px; font-size: 11px; padding: 2px 8px;
    border-radius: 999px; font-weight: 600;
  }
  .modo.ia { background: #e3f6ea; color: var(--verde); }
  .modo.det { background: #fdf2dc; color: var(--ambar); }
  .modo.err { background: #fbe4e4; color: var(--rojo); }

  .typing .bubble { color: var(--gris); font-style: italic; }
  .typing span { animation: blink 1.2s infinite; }
  .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink { 0%,60%,100%{opacity:.25} 30%{opacity:1} }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .chip {
    background: #fff; border: 1px solid var(--borde); color: var(--azul);
    padding: 7px 12px; border-radius: 999px; font-size: 13px; cursor: pointer;
  }
  .chip:hover { background: #eef4fa; }

  footer { padding: 12px 16px; display: flex; justify-content: center; background: transparent; }
  .composer {
    width: 100%; max-width: 820px; display: flex; gap: 10px; align-items: flex-end;
    background: #fff; border: 1px solid var(--borde); border-radius: 14px;
    padding: 8px 8px 8px 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .composer textarea {
    flex: 1; border: 0; resize: none; outline: none; font: inherit; font-size: 14.5px;
    max-height: 140px; line-height: 1.4; padding: 6px 0;
  }
  .composer button {
    background: var(--azul); color: #fff; border: 0; border-radius: 10px;
    width: 42px; height: 42px; cursor: pointer; font-size: 18px; flex: 0 0 42px;
  }
  .composer button:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 820px; width:100%; margin: 6px auto 0; font-size: 11px; color: var(--gris); text-align: center; }
</style>
</head>
<body>
  <header>
    <div class="logo">⛽</div>
    <div>
      <h1>Asistente de Calidad de Gas Natural</h1>
      <p>Comparación regulatoria · España · Portugal · Francia · UE</p>
    </div>
    <div class="spacer"></div>
    <span class="badge"><span id="statusDot" class="dot off"></span><span id="statusText">Comprobando…</span></span>
    <button class="iconbtn" id="newBtn" title="Nueva conversación">↺</button>
    <button class="iconbtn" id="gearBtn" title="Configuración">⚙</button>
  </header>

  <div id="settings">
    <label>URL del backend:</label>
    <input id="backendUrl" type="text" placeholder="http://localhost:8000" />
    <button id="saveUrl">Guardar y reconectar</button>
  </div>

  <main>
    <div id="chat"></div>
  </main>

  <footer>
    <div style="width:100%; display:flex; flex-direction:column; align-items:center;">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Escribe tu consulta sobre calidad de gas natural…"></textarea>
        <button id="sendBtn" title="Enviar">➤</button>
      </div>
      <div class="hint">Las cifras provienen del motor determinista (normativa verificada). Enter envía · Shift+Enter salto de línea.</div>
    </div>
  </footer>

<script>
  const EJEMPLOS = [
    "¿Cuál es el límite de oxígeno en España y en Portugal? ¿Son comparables?",
    "Compara el PCS entre España y Francia.",
    "Compara el índice de Wobbe entre España y Portugal.",
    "¿Qué es el índice de Wobbe?",
  ];

  const $ = (id) => document.getElementById(id);
  const chat = $("chat");

  let backendUrl = localStorage.getItem("gas_chat_backend") || "http://localhost:8000";
  let sessionId = localStorage.getItem("gas_chat_session");
  if (!sessionId) {
    sessionId = (crypto.randomUUID && crypto.randomUUID()) || ("s-" + Date.now() + Math.random());
    localStorage.setItem("gas_chat_session", sessionId);
  }
  $("backendUrl").value = backendUrl;

  function md(text) {
    try {
      if (window.marked) {
        let html = marked.parse(text, { breaks: true, gfm: true });
        if (window.DOMPurify) html = DOMPurify.sanitize(html);
        return { html };
      }
    } catch (e) {}
    return { text };
  }

  function addMessage(role, text, modo) {
    const msg = document.createElement("div");
    msg.className = "msg " + (role === "user" ? "user" : "bot");
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "🧑" : "⛽";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    const rendered = md(text);
    if (rendered.html !== undefined) bubble.innerHTML = rendered.html;
    else { bubble.style.whiteSpace = "pre-wrap"; bubble.textContent = rendered.text; }
    if (modo) {
      const tag = document.createElement("div");
      const cls = modo === "ia" ? "ia" : (modo === "error" ? "err" : "det");
      const label = modo === "ia" ? "IA + datos verificados" : (modo === "error" ? "Error" : "Motor determinista");
      tag.className = "modo " + cls;
      tag.textContent = label;
      bubble.appendChild(tag);
    }
    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chat.appendChild(msg);
    scrollDown();
    return bubble;
  }

  function scrollDown() { const m = document.querySelector("main"); m.scrollTop = m.scrollHeight; }

  function showWelcome() {
    chat.innerHTML = "";
    const bubble = addMessage("bot",
      "¡Hola! Soy el asistente de **calidad de gas natural**. Puedo comparar parámetros " +
      "(Wobbe, PCS, densidad, azufre, H₂S+COS, O₂, CO₂, puntos de rocío) entre **España, " +
      "Portugal, Francia y la UE**, con trazabilidad a la fuente.\n\nPrueba con un ejemplo:");
    const chips = document.createElement("div");
    chips.className = "chips";
    EJEMPLOS.forEach((q) => {
      const c = document.createElement("button");
      c.className = "chip"; c.textContent = q;
      c.onclick = () => { $("input").value = q; enviar(); };
      chips.appendChild(c);
    });
    bubble.appendChild(chips);
  }

  async function checkStatus() {
    const dot = $("statusDot"), txt = $("statusText");
    try {
      const r = await fetch(backendUrl.replace(/\/$/, "") + "/api/status", { method: "GET" });
      const d = await r.json();
      const modo = (d.modo || "").toLowerCase();
      dot.className = "dot " + (modo === "ia" ? "ia" : "det");
      txt.textContent = modo === "ia" ? "OpenAI conectado" : "Modo determinista";
    } catch (e) {
      dot.className = "dot off";
      txt.textContent = "Backend no disponible";
    }
  }

  let enviando = false;
  async function enviar() {
    const input = $("input");
    const mensaje = input.value.trim();
    if (!mensaje || enviando) return;
    enviando = true; $("sendBtn").disabled = true;
    addMessage("user", mensaje);
    input.value = ""; input.style.height = "auto";

    const typing = addMessage("bot", "");
    typing.parentElement.classList.add("typing");
    typing.innerHTML = "Consultando<span>.</span><span>.</span><span>.</span>";

    try {
      const r = await fetch(backendUrl.replace(/\/$/, "") + "/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, mensaje }),
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      typing.parentElement.remove();
      addMessage("bot", d.respuesta || "No se recibió respuesta.", d.modo || "ia");
    } catch (e) {
      typing.parentElement.remove();
      addMessage("bot",
        "No pude conectar con el backend en `" + backendUrl + "`.\n\n" +
        "Asegúrate de tenerlo arrancado:\n\n```\npython -m uvicorn api:app --reload\n```\n\n" +
        "Detalle: " + e.message, "error");
    } finally {
      enviando = false; $("sendBtn").disabled = false; $("input").focus();
    }
  }

  // --- eventos ---
  $("sendBtn").onclick = enviar;
  $("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); }
  });
  $("input").addEventListener("input", function () {
    this.style.height = "auto"; this.style.height = Math.min(this.scrollHeight, 140) + "px";
  });
  $("gearBtn").onclick = () => $("settings").classList.toggle("open");
  $("saveUrl").onclick = () => {
    backendUrl = $("backendUrl").value.trim() || "http://localhost:8000";
    localStorage.setItem("gas_chat_backend", backendUrl);
    $("settings").classList.remove("open");
    checkStatus();
  };
  $("newBtn").onclick = () => {
    sessionId = (crypto.randomUUID && crypto.randomUUID()) || ("s-" + Date.now());
    localStorage.setItem("gas_chat_session", sessionId);
    showWelcome();
  };

  showWelcome();
  checkStatus();
  setInterval(checkStatus, 15000);
</script>
</body>
</html>
