<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asistente de Calidad de Gas Natural · Enagás</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root{
    --navy:#0b2a4a; --navy-2:#103a63; --blue:#1565a8;
    --teal:#00a9a5; --teal-d:#007f7c;
    --bg:#eef2f6; --surface:#ffffff; --surface-2:#f6f9fc;
    --border:#dde4ec; --border-strong:#c7d2de;
    --text:#16222e; --muted:#5d6b7a;
    --green:#15803d; --green-bg:#e7f6ec;
    --red:#c0392b; --red-bg:#fcebe9;
    --amber:#a86a00; --amber-bg:#fbf1dc;
    --shadow:0 1px 2px rgba(16,34,46,.06),0 4px 16px rgba(16,34,46,.06);
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Segoe UI",-apple-system,Roboto,Helvetica,Arial,sans-serif;
    color:var(--text); background:var(--bg);
    display:flex; flex-direction:column; height:100vh; font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- App bar ---------- */
  .appbar{
    display:flex; align-items:center; gap:16px;
    padding:0 24px; height:64px; flex:0 0 64px;
    background:linear-gradient(100deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff; box-shadow:0 2px 10px rgba(11,42,74,.18); z-index:5;
  }
  .brand{display:flex; align-items:center; gap:13px; min-width:0}
  .logo{
    width:40px;height:40px;border-radius:10px;flex:0 0 40px;
    background:linear-gradient(135deg,var(--teal),var(--teal-d));
    display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,169,165,.35);
  }
  .brand h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.2px;white-space:nowrap}
  .brand p{font-size:12px;margin:1px 0 0;color:#a9c6e0;font-weight:400}
  .spacer{flex:1}
  .status{
    display:inline-flex;align-items:center;gap:8px;font-size:12.5px;
    padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.12);color:#dfeaf5;white-space:nowrap;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#8aa;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
  .dot.ok{background:#34d399} .dot.det{background:#f5c451} .dot.off{background:#f87171}
  .btn{
    font:inherit;font-size:13px;cursor:pointer;border-radius:8px;
    padding:8px 14px;border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.08);color:#fff;transition:.15s;
  }
  .btn:hover{background:rgba(255,255,255,.18)}
  .btn-icon{width:38px;height:38px;padding:0;font-size:16px;display:grid;place-items:center}

  /* ---------- Settings ---------- */
  #settings{display:none;align-items:center;gap:10px;flex-wrap:wrap;
    background:#06223c;color:#cfe0ef;padding:12px 24px;font-size:13px}
  #settings.open{display:flex}
  #settings input{flex:1;min-width:240px;padding:8px 11px;border-radius:7px;
    border:1px solid #21527f;background:#0a2f50;color:#fff;font:inherit;font-size:13px}
  #settings .btn{background:var(--teal);border-color:transparent}
  #settings .btn:hover{background:var(--teal-d)}

  /* ---------- Conversation ---------- */
  main{flex:1;overflow-y:auto;padding:28px 16px 8px}
  #chat{width:100%;max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

  .msg{display:flex;gap:13px;max-width:100%}
  .msg .avatar{
    width:34px;height:34px;border-radius:9px;flex:0 0 34px;display:grid;place-items:center;
  }
  .msg.bot .avatar{background:linear-gradient(135deg,var(--teal),var(--teal-d))}
  .msg.user{flex-direction:row-reverse}
  .msg.user .avatar{background:#d8e2ec;color:var(--navy);font-weight:600;font-size:13px}

  .bubble{
    padding:15px 18px;border-radius:var(--radius);font-size:14.5px;
    box-shadow:var(--shadow);max-width:min(760px,calc(100% - 50px));overflow-x:auto;
  }
  .msg.bot .bubble{background:var(--surface);border:1px solid var(--border);border-top-left-radius:4px}
  .msg.user{align-self:flex-end}
  .msg.user .bubble{
    background:linear-gradient(135deg,var(--navy-2),var(--blue));color:#fff;
    border-top-right-radius:4px;box-shadow:0 2px 10px rgba(21,101,168,.25);
  }

  /* Markdown inside assistant messages */
  .bubble p{margin:0 0 10px} .bubble p:last-child{margin-bottom:0}
  .bubble strong{font-weight:600}
  /* títulos de sección (líneas que son solo **negrita**) */
  .bubble p > strong:only-child{
    display:block;color:var(--navy);font-size:12px;font-weight:700;
    text-transform:uppercase;letter-spacing:.6px;margin:4px 0 2px;
  }
  .bubble table{border-collapse:collapse;width:100%;margin:10px 0 14px;font-size:13px;
    border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .bubble thead th{
    background:var(--navy);color:#fff;font-weight:600;text-align:left;
    padding:9px 12px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;
  }
  .bubble tbody td{padding:9px 12px;border-top:1px solid var(--border);vertical-align:top}
  .bubble tbody tr:nth-child(even){background:var(--surface-2)}
  .bubble tbody td:first-child{font-weight:600;color:var(--navy-2)}
  .bubble code{background:#eef2f6;padding:1px 6px;border-radius:5px;font-size:12.5px;
    font-family:"Cascadia Code",Consolas,monospace}
  .bubble a{color:var(--blue)}
  .bubble ul{margin:6px 0;padding-left:20px}

  /* Welcome / empty state */
  .welcome h2{font-size:18px;margin:0 0 8px;color:var(--navy)}
  .welcome .lead{color:var(--muted);margin:0 0 16px;font-size:14.5px}
  .chips{display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .chip{
    text-align:left;background:var(--surface);border:1px solid var(--border);
    color:var(--navy-2);padding:11px 14px;border-radius:10px;font:inherit;font-size:13.5px;
    cursor:pointer;transition:.15s;display:flex;align-items:center;gap:10px;
  }
  .chip:hover{border-color:var(--teal);background:#f3fbfb;transform:translateY(-1px);box-shadow:var(--shadow)}
  .chip::before{content:"›";color:var(--teal);font-weight:700;font-size:16px}

  .modo{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;
    padding:3px 9px;border-radius:999px;font-weight:600;letter-spacing:.2px}
  .modo.ia{background:var(--green-bg);color:var(--green)}
  .modo.det{background:var(--amber-bg);color:var(--amber)}
  .modo.err{background:var(--red-bg);color:var(--red)}

  .typing .bubble{color:var(--muted);font-style:italic;display:flex;gap:4px;align-items:center}
  .typing b{width:6px;height:6px;border-radius:50%;background:var(--teal);display:inline-block;animation:bl 1.2s infinite}
  .typing b:nth-child(2){animation-delay:.18s} .typing b:nth-child(3){animation-delay:.36s}
  @keyframes bl{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  /* ---------- Composer ---------- */
  .dock{flex:0 0 auto;padding:10px 16px 14px;background:linear-gradient(180deg,rgba(238,242,246,0),var(--bg) 40%)}
  .composer{
    width:100%;max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;
    background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;
    padding:8px 8px 8px 16px;box-shadow:var(--shadow);
  }
  .composer:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,169,165,.12),var(--shadow)}
  .composer textarea{
    flex:1;border:0;resize:none;outline:none;font:inherit;font-size:14.5px;
    max-height:150px;line-height:1.45;padding:8px 0;background:transparent;color:var(--text);
  }
  .send{
    flex:0 0 44px;width:44px;height:44px;border:0;border-radius:11px;cursor:pointer;
    background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff;
    display:grid;place-items:center;transition:.15s;box-shadow:0 2px 8px rgba(0,169,165,.3)}
  .send:hover{filter:brightness(1.06)} .send:disabled{opacity:.45;cursor:default;box-shadow:none}
  .disclaimer{max-width:900px;margin:8px auto 0;font-size:11px;color:var(--muted);text-align:center;line-height:1.45}
  .disclaimer b{color:#46586a;font-weight:600}
</style>
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 2.5c2.2 3.2 5.4 4.8 5.4 8.7a5.4 5.4 0 1 1-10.8 0c0-1.7.7-3 1.7-4.2.5 1 .9 1.6 1.8 2.1-.2-2.4 .7-4.7 1.9-6.6Z" fill="#fff"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Asistente de Calidad de Gas Natural</h1>
        <p>Comparación regulatoria · España · Portugal · Francia · UE</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="status"><span id="statusDot" class="dot off"></span><span id="statusText">Comprobando…</span></div>
    <button class="btn" id="newBtn">Nueva consulta</button>
    <button class="btn btn-icon" id="gearBtn" title="Configuración">⚙</button>
  </header>

  <div id="settings">
    <label>URL del backend:</label>
    <input id="backendUrl" type="text" placeholder="http://localhost:8000" />
    <button class="btn" id="saveUrl">Guardar</button>
  </div>

  <main><div id="chat"></div></main>

  <div class="dock">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Escriba su consulta sobre calidad de gas natural…"></textarea>
      <button class="send" id="sendBtn" title="Enviar" aria-label="Enviar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 12l16-7-7 16-2.5-6.5L4 12Z" fill="currentColor"/></svg>
      </button>
    </div>
    <p class="disclaimer">
      Herramienta de <b>soporte a la decisión</b>. Las cifras proceden de normativa verificada con
      trazabilidad documental; no sustituye la consulta del texto normativo oficial.
    </p>
  </div>

<script>
  const EJEMPLOS = [
    "¿Cuál es el límite de oxígeno en España y en Portugal? ¿Son comparables?",
    "Compara el índice de Wobbe entre España y Francia.",
    "¿En qué países cumple un PCS de 12 kWh/m³?",
    "El gas tiene 4 mg/Nm³ de H₂S+COS, ¿cumple en Portugal?",
  ];

  const $ = (id) => document.getElementById(id);
  const chat = $("chat");

  const servedOrigin = location.protocol.indexOf("http") === 0 ? location.origin : "";
  let backendUrl = servedOrigin || localStorage.getItem("gas_chat_backend") || "http://localhost:8000";
  let sessionId = localStorage.getItem("gas_chat_session");
  if (!sessionId) {
    sessionId = (crypto.randomUUID && crypto.randomUUID()) || ("s-" + Date.now() + Math.random());
    localStorage.setItem("gas_chat_session", sessionId);
  }
  $("backendUrl").value = localStorage.getItem("gas_chat_backend") || backendUrl;

  function md(text){
    try{
      if(window.marked){
        let html = marked.parse(text,{breaks:true,gfm:true});
        if(window.DOMPurify) html = DOMPurify.sanitize(html);
        return {html};
      }
    }catch(e){}
    return {text};
  }

  function initials(){ return "Tú"; }

  function addMessage(role, text, modo){
    const msg = document.createElement("div");
    msg.className = "msg " + (role === "user" ? "user" : "bot");
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    if(role === "user"){ avatar.textContent = initials(); }
    else { avatar.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3c1.8 2.6 4.4 3.9 4.4 7a4.4 4.4 0 1 1-8.8 0c0-1.4.6-2.5 1.4-3.4.4.8.7 1.3 1.5 1.7-.2-2 .6-3.8 1.5-5.3Z" fill="#fff"/></svg>'; }
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    const r = md(text);
    if(r.html !== undefined) bubble.innerHTML = r.html;
    else { bubble.style.whiteSpace = "pre-wrap"; bubble.textContent = r.text; }
    if(modo){
      const tag = document.createElement("div");
      const cls = modo === "ia" ? "ia" : (modo === "error" ? "err" : "det");
      const label = modo === "ia" ? "IA · datos verificados" : (modo === "error" ? "Error" : "Motor determinista");
      tag.className = "modo " + cls; tag.textContent = label;
      bubble.appendChild(tag);
    }
    msg.appendChild(avatar); msg.appendChild(bubble);
    chat.appendChild(msg); scrollDown();
    return bubble;
  }

  function scrollDown(){ const m = document.querySelector("main"); m.scrollTop = m.scrollHeight; }

  function showWelcome(){
    chat.innerHTML = "";
    const msg = document.createElement("div");
    msg.className = "msg bot";
    msg.innerHTML = '<div class="avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3c1.8 2.6 4.4 3.9 4.4 7a4.4 4.4 0 1 1-8.8 0c0-1.4.6-2.5 1.4-3.4.4.8.7 1.3 1.5 1.7-.2-2 .6-3.8 1.5-5.3Z" fill="#fff"/></svg></div>';
    const b = document.createElement("div");
    b.className = "bubble welcome";
    b.innerHTML =
      '<h2>Bienvenido/a</h2>' +
      '<p class="lead">Consulte y compare requisitos de calidad de gas natural (índice de Wobbe, PCS, ' +
      'densidad, azufre, H₂S+COS, O₂, CO₂, puntos de rocío) entre España, Portugal, Francia y la UE, ' +
      'con trazabilidad a la fuente normativa.</p>';
    const chips = document.createElement("div");
    chips.className = "chips";
    EJEMPLOS.forEach(q => {
      const c = document.createElement("button");
      c.className = "chip"; c.textContent = q;
      c.onclick = () => { $("input").value = q; enviar(); };
      chips.appendChild(c);
    });
    b.appendChild(chips);
    msg.appendChild(b); chat.appendChild(msg);
  }

  async function checkStatus(){
    const dot = $("statusDot"), txt = $("statusText");
    try{
      const r = await fetch(backendUrl.replace(/\/$/,"") + "/api/status");
      const d = await r.json();
      const modo = (d.modo || "").toLowerCase();
      dot.className = "dot " + (modo === "ia" ? "ok" : "det");
      txt.textContent = modo === "ia" ? "Conectado · IA" : "Conectado · Motor determinista";
    }catch(e){
      dot.className = "dot off"; txt.textContent = "Backend no disponible";
    }
  }

  let enviando = false;
  async function enviar(){
    const input = $("input");
    const mensaje = input.value.trim();
    if(!mensaje || enviando) return;
    enviando = true; $("sendBtn").disabled = true;
    addMessage("user", mensaje);
    input.value = ""; input.style.height = "auto";

    const typing = addMessage("bot","");
    typing.parentElement.classList.add("typing");
    typing.innerHTML = 'Consultando la normativa <b></b><b></b><b></b>';

    try{
      const r = await fetch(backendUrl.replace(/\/$/,"") + "/api/chat",{
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ session_id: sessionId, mensaje })
      });
      if(!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      typing.parentElement.remove();
      addMessage("bot", d.respuesta || "No se recibió respuesta.", d.modo || "ia");
    }catch(e){
      typing.parentElement.remove();
      addMessage("bot",
        "No se pudo conectar con el servidor en `" + backendUrl + "`.\n\n" +
        "Verifique que el backend está en marcha (ejecute `iniciar_chatbot.bat`).\n\nDetalle: " + e.message, "error");
    }finally{
      enviando = false; $("sendBtn").disabled = false; $("input").focus();
    }
  }

  $("sendBtn").onclick = enviar;
  $("input").addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); enviar(); }});
  $("input").addEventListener("input", function(){ this.style.height = "auto"; this.style.height = Math.min(this.scrollHeight,150) + "px"; });
  $("gearBtn").onclick = () => $("settings").classList.toggle("open");
  $("saveUrl").onclick = () => {
    const v = $("backendUrl").value.trim();
    if(v){ backendUrl = v; localStorage.setItem("gas_chat_backend", v); }
    $("settings").classList.remove("open"); checkStatus();
  };
  $("newBtn").onclick = () => {
    sessionId = (crypto.randomUUID && crypto.randomUUID()) || ("s-" + Date.now());
    localStorage.setItem("gas_chat_session", sessionId);
    showWelcome(); $("input").focus();
  };

  showWelcome(); checkStatus(); setInterval(checkStatus, 15000);
</script>
</body>
</html>
