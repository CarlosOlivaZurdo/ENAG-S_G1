<text x="776.0" y="178" font-size="13" font-weight="bold" fill="#013a57" text-anchor="middle">3 · unidades · flags</text>
<text x="776.0" y="198" font-size="11.5" fill="#1b2a38" text-anchor="middle">catálogos auxiliares</text>
