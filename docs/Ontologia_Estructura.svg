<text x="195.0" y="198" font-size="11.5" fill="#1b2a38" text-anchor="middle">fuentes_normativas[]  (las normas)</text>
<rect x="360" y="158" width="262" height="64" rx="9" fill="#eaf6fc" stroke="#0099d6" stroke-width="1.5"/>
<text x="491.0" y="178" font-size="13" font-weight="bold" fill="#013a57" text-anchor="middle">2 · parametros:</text>
<text x="491.0" y="198" font-size="11.5" fill="#1b2a38" text-anchor="middle">los 10 índices de calidad</text>
