<text x="64" y="920" font-size="11.5" fill="#3a4754" text-anchor="start">VERIFICADO = consta en fuente oficial.   NO_VERIFICABLE_SIN_FUENTE = no se inventa (se deja en blanco).</text>
<text x="64" y="944" font-size="11.5" fill="#3a4754" text-anchor="start">El motor determinista LEE de aquí. Cada límite es trazable a su fuente: documento · artículo · página · URL.</text>
