# =============================================================================
# UNIDADES
# =============================================================================

unidades:
  pct_vol: { simbolo: "% (vol)", tipo: fraccion_volumetrica, equivalencia_ppm: "1 % vol = 10.000 ppm vol" }
  pct_mol: { simbolo: "% mol", tipo: fraccion_molar, nota: "Para gas natural a c.n., % mol ≈ % vol (< 0,1 %)." }
  ppm_vol: { simbolo: "ppm(vol)", tipo: fraccion_volumetrica }
  mg_per_nm3:
    simbolo: "mg/Nm³"
    tipo: concentracion_masica
    condiciones_normales: { temperatura_C: 0, presion_bar: 1.01325 }
    distincion_critica: "Nm³ (0 ºC) ≠ m³ estándar (15 ºC). Corregir antes de comparar."
    nota: "ES, PT y FR expresan las concentraciones en mg/m³(n) (= mg/Nm³, 0 ºC). Comparables directamente."
  mg_per_sm3:
    simbolo: "mg/m³ (@15ºC)"
    tipo: concentracion_masica
    condiciones: { temperatura_C: 15, presion_bar: 1.01325 }
    conversion_a_nm3: "valor_Nm3 = valor_sm3 × (288.15 / 273.15) ≈ × 1.0549"
  MJ_per_nm3:
    simbolo: "MJ/Nm³"
    tipo: densidad_energetica
    nota: "Usado por Portugal para Wobbe. 1 MJ/m³ = 1/3,6 kWh/m³ ≈ 0,2778 kWh/m³."
  kWh_per_nm3:
    simbolo: "kWh/Nm³"
    tipo: densidad_energetica
    nota: "Usado por España y Francia para PCS/Wobbe. 1 kWh/m³ = 3,6 MJ/m³."
  grados_C: { simbolo: "ºC", tipo: temperatura, nota: "Puntos de rocío. Comparable sólo a igual presión de referencia." }
  adimensional: { simbolo: "—", tipo: adimensional, nota: "Densidad relativa (gas/aire)." }


# =============================================================================
# FLAGS DE COMPARABILIDAD
# =============================================================================

flags:
  COMPARABLE:
    icono: "🟢"
    descripcion: "Misma unidad y condiciones de referencia (o conversión exacta aplicada)."
    accion: "Mostrar comparación directa con trazabilidad a fuente."
  COMPARABLE_TRAS_NORMALIZAR:
    icono: "🟡"
    descripcion: "Unidades/condiciones distintas pero existe conversión determinista verificada."
    accion: "Aplicar factor, mostrar valor normalizado y condiciones de partida y llegada."
  NO_COMPARABLE:
    icono: "🔴"
    descripcion: "Falta información (condiciones no especificadas) o no existe conversión válida."
    accion: "Explicar por qué no es comparable e indicar qué información faltaría."
    ejemplos_de_activacion:
      - "Jurisdicción cuyo valor está NO_VERIFICABLE_SIN_FUENTE (p.ej. PCS de Portugal, CO₂ de Portugal)"
      - "Puntos de rocío a presiones de referencia distintas (ES @70 bar vs PT @presión máx. operación)"
      - "Valor en mg/m³ sin indicar si es a 0 ºC o 15 ºC"
  NO_COMPARABLE_SIN_DATOS:
    icono: "🔴"
    descripcion: "Falta el valor o la unidad del dato del usuario."
    accion: "Solicitar valor y unidad con sus condiciones de referencia."
  UNIDADES_INCOMPATIBLES:
    icono: "🔴"
    descripcion: "Magnitudes físicas no convertibles entre sí."
    accion: "Escalar a revisión experta o pedir aclaración."


# =============================================================================
# ORQUESTADOR Y MOTOR DE REGLAS
# =============================================================================

orquestador:
  descripcion: >
    Recibe la pregunta en lenguaje natural y decide la rama. El LLM clasifica la
    intención; la lógica de negocio la ejecuta código determinista.
  clasificacion_preguntas:
    fuera_de_ambito:
      descripcion: "La pregunta no trata de calidad de gas natural → rechazar/redirigir."
      ejemplos: ["¿Cuál es el peaje de entrada?", "¿Cómo tributa el gas?"]
      ruta: rechazo
    comparativa:
      descripcion: "Comparar un parámetro entre jurisdicciones o evaluar cumplimiento."
      ejemplos:
        - "¿Cuál es el límite de O₂ en España y en Portugal? ¿Son comparables?"
        - "Compara el PCS español con el francés."
        - "El gas tiene 12 mg/m³ de H₂S+COS a 15 ºC, ¿cumple el límite español?"
      ruta: ontologia → normalizador → flag → LLM_redacta
    abierta:
      descripcion: "Información normativa sin comparación numérica directa. Se resuelve por RAG."
      ejemplos:
        - "¿Qué dice la normativa portuguesa sobre el punto de rocío?"
        - "¿Qué es el índice de Wobbe?"
      ruta: RAG (Vector DB + chunks PDF) → LLM_redacta_con_cita

motor_reglas:
  descripcion: "Pipeline determinista para preguntas comparativas. El LLM sólo redacta al final."
  pasos:
    "1_clasificar_pregunta": { salida: "tipo ∈ {fuera_de_ambito, comparativa, abierta}" }
    "2_identificar_parametro":
      salida: "parametro_id ∈ {WOBBE, PCS, DENS_REL, S_TOTAL, H2S_COS, RSH, O2, CO2, PR_H2O, PR_HC} o ERROR"
    "3_identificar_jurisdicciones":
      salida: "lista de jurisdicciones ∈ {ES, PT, FR, UE, ...}"
    "4_recuperar_limites":
      accion: "Leer de la ontología los límites de cada jurisdicción. Sin LLM."
      salida: "limites[jur], condiciones[jur], estado_verificacion[jur]"
    "5_extraer_valor_usuario":
      accion: "Si hay valor medido, extraer valor + unidad + condiciones. Si faltan → NO_COMPARABLE."
    "6_normalizar":
      accion: "Convertir a unidad base con pint + factores de corrección de condiciones (MJ↔kWh, @25/0↔@0/0, Nm³↔sm³)."
      herramienta: pint
    "7_evaluar_comparabilidad":
      accion: >
        Asignar flag. Si alguna jurisdicción está NO_VERIFICABLE_SIN_FUENTE o
        PENDIENTE_EXTRACCION → 🔴 (no se inventa la cifra ausente). Si las unidades o
        condiciones difieren pero hay factor verificado → 🟡. Si coinciden → 🟢.
      salida: "flag, razon_flag"
    "8_evaluar_cumplimiento":
      accion: "Si hay valor de usuario, comparar contra límites normalizados."
      salida: "CUMPLE / INCUMPLE por jurisdicción"
    "9_generar_respuesta":
      accion: "Pasar al LLM datos estructurados con citas; redacta las 7 secciones sin inventar números."
      garantias:
        - "Trazabilidad: toda cifra con artículo, documento, país y página."
        - "Sin alucinación numérica."
        - "Flag explícito con icono y explicación."
        - "Estructura de respuesta de 7 secciones."


# =============================================================================
# ARQUITECTURA RAG (preguntas abiertas)
# =============================================================================

rag:
  descripcion: >
    Recuperación para preguntas abiertas. El LLM responde fundamentado en fragmentos
    recuperados de los PDFs, nunca de memoria. Toda afirmación con cita por metadatos.
  fuentes_pdf:
    - { id: ORDEN_TED_181_2025, pais: ES, archivo: "data/raw/BOE-A-2025-3873-consolidado.pdf" }
    - { id: RD919,             pais: ES, archivo: "data/raw/BOE-A-2006-15345-consolidado.pdf" }
    - { id: REG_PT_826_2023,   pais: PT, archivo: "data/raw/regulacion_portugal_826-2023.pdf" }
    - { id: FR_GRDF,           pais: FR, archivo: "data/raw/Prescriptions_techniques_GRDF.pdf" }
    - { id: FR_GRTGAZ,         pais: FR, archivo: "data/raw/annexe-4-spec-grtgaz-methane-de-synthese-pour-injection.pdf" }
    - { id: NC_INT,            pais: UE, archivo: "data/raw/CELEX_32015R0703_ES_TXT.pdf" }
    - { id: NC_CAM,            pais: UE, archivo: "data/raw/CELEX_32017R0459_ES_TXT.pdf" }
  chunking:
    estrategia: por_articulo_o_seccion
    tamano_aproximado_tokens: 400
    solapamiento_tokens: 50
    nota: "Preservar país, documento, artículo/sección y página en metadatos (trazabilidad)."
  metadatos_por_chunk: [documento_id, pais, version_documento, titulo_documento, articulo_o_seccion, pagina, fecha_publicacion, url_fuente_oficial]
  retrieval: { metodo: similitud_coseno, top_k: 5, reranking: opcional_cross_encoder }
  respuesta:
    formato: "Texto del LLM + cita inline: (Fuente: [pais]/[documento_id], [artículo], p. [página])"
    garantia: "El LLM no responde sin fragmento recuperado de respaldo."
