        nota: "El 0,500 mínimo aparece solo en la Annexe 4 «méthane de synthèse»; para gas natural convencional la banda es 0,555 – 0,700 (research ES-PT-FR)."
      UE:
        fuente: EASEE_GAS
        articulo: "CBP 2005-001/01, §4 (tabla de rangos)"
        tipo_limite: rango
        valor_min: 0.555
        valor_max: 0.700
        unidad: adimensional
        expresion_original: "d: 0,555 — 0,700"
        estado_verificacion: VERIFICADO
        nota: "Recomendación EASEE-gas (no vinculante). Adimensional: comparable directamente."

  # ---------------------------------------------------------------------------
  S_TOTAL:
  # ---------------------------------------------------------------------------
    nombre_completo: Azufre Total
    simbolo: "S total"
    nombre_ingles: Total sulphur
    grupo: azufrados
    tipo: contaminante
    aliases: [azufre total, s total, total sulphur, soufre total, enxofre total]
    limites:
      ES:
        fuente: ORDEN_TED_181_2025
