        expresion_original: "S total: – / 50 mg/m³(n)"
        estado_verificacion: VERIFICADO
      FR:
        fuente: FR_GRTGAZ
        articulo: "Annexe 4, tabla (pág. 1)"
        tipo_limite: maximo
        valor: 30.0
        unidad: mg_per_nm3
        expresion_original: "Teneur en soufre total < 30 mgS/m³(n)"
        estado_verificacion: VERIFICADO
        nota: "GRTgaz (inyección transporte). GRDF gas natural distribución: ≤ 150 mg/m³(n)."
      UE:
        fuente: EASEE_GAS
        articulo: "CBP 2005-001/01, §4 (tabla de rangos)"
        tipo_limite: maximo
        valor: 30.0
        unidad: mg_per_nm3
        expresion_original: "Total S: – / 30 mg/m³"
        estado_verificacion: VERIFICADO
        nota: "Recomendación EASEE-gas (no vinculante)."

  # ---------------------------------------------------------------------------
  H2S_COS:
  # ---------------------------------------------------------------------------
    nombre_completo: "H₂S + COS (expresado como S)"
    simbolo: "H₂S + COS (como S)"
    nombre_ingles: "H2S + COS (as S)"
    grupo: azufrados
    tipo: contaminante
    masa_molar_H2S_g_mol: 34.08
    motivacion_limite: "H₂S tóxico y corrosivo; COS hidroliza a H₂S. Se limita la suma como azufre."
    aliases: [h2s, h₂s, sulfuro de hidrógeno, hydrogen sulphide, ácido sulfhídrico, h2s+cos, cos]
    limites:
      ES:
        fuente: ORDEN_TED_181_2025
        articulo: "Tabla 3, apartado 2.5.2.1 (pág. 27)"
        tipo_limite: maximo
