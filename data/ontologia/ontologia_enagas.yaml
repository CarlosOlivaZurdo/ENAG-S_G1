      nota: "Gas hoogcalorisch (H-gas). Valores trasladados de la Regeling gaskwaliteit (derogada 1-1-2026) a la Energieregeling art. 3.16(1)(b); la ACM confirma que NO cambian (cambio terminológico). Fija Wobbe, O₂, CO₂, azufre total y rocío de agua. El HC se controla como CONDENSADO (≤5 mg/m³(n) a -3 ºC), no como °C de rocío; NO fija PCS ni densidad (→ NO_VERIFICABLE). H₂S/mercaptanos: el deep-research los da (5/6) pero una lectura directa no los localizó → PENDIENTE de re-confirmar contra la Bijlage 1 de la Energieregeling."
      ambito: "Especificaciones de calidad del gas H en la red de transporte neerlandesa (GTS)."

