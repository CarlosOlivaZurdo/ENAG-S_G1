# =============================================================================
# ONTOLOGÍA DE CALIDAD DEL GAS NATURAL — ENAGÁS RETO 5
# Comparativa normativa ES vs UE — Parámetros: O₂, H₂S, PCS
# =============================================================================
#
# PROPÓSITO
# Esta ontología es la "fuente de verdad" determinista del sistema.
# El LLM nunca inventa números: todos los valores numéricos salen de aquí.
# El LLM sólo interpreta la pregunta y redacta la respuesta final.
#
# ARQUITECTURA
# Pregunta → Orquestador → ¿Comparativa? → Ontología + Normalizador → Flag → LLM redacta
#                       → ¿Abierta?    → RAG (Vector DB + chunks PDF) → LLM con cita
#
# FUENTES VERIFICADAS
# Revisión 2026-06: los valores numéricos ES se han verificado contra el
# Protocolo de Detalle PD-01 («Medición, Calidad y Odorización de Gas»),
# apartado 5.2, Tabla 3, publicado en el BOE y reproducido por Enagás.
# El Reglamento (UE) 2015/703 NO fija límites numéricos de O₂, H₂S ni de
# rango de PCS: sólo fija unidades, condiciones de referencia y obligaciones
# de monitorización de Wobbe/PCS. Por ello los límites numéricos UE quedan
# marcados como NO_VERIFICABLE_SIN_FUENTE (no existen en la norma citada).
# =============================================================================

ontologia:
  version: "2.0.0"
  fecha_revision: "2026-06"
  descripcion: >
    Ontología determinista para comparar parámetros de calidad del gas natural
    entre la normativa española (RD 919/2006 + NGTS-06) y la europea
    (Network Code INT — Reglamento UE 2015/703). Cubre exclusivamente O₂, H₂S
    y PCS. Toda respuesta comparativa se genera a partir de esta ontología;
    el LLM nunca calcula ni infiere valores numéricos.

  # ---------------------------------------------------------------------------
  # FUENTES NORMATIVAS
  # ---------------------------------------------------------------------------
  fuentes_normativas:

    - id: RD919
      tipo: reglamento_nacional
      nombre: "Real Decreto 919/2006, de 28 de julio"
      pais: España
      publicacion: "BOE núm. 211, de 4 de septiembre de 2006, págs. 31576-31632"
      url_boe: "https://www.boe.es/buscar/act.php?id=BOE-A-2006-15345"
      eli: "https://www.boe.es/eli/es/rd/2006/07/28/919"
      ambito: >
        Reglamento técnico de distribución y utilización de combustibles gaseosos
        y sus instrucciones técnicas complementarias ICG 01 a 11.
      nota: >
        IMPORTANTE: este RD regula la distribución y utilización (ICG), NO contiene
        la tabla numérica de especificaciones de calidad del gas de transporte.
        Esos valores (O₂, H₂S, PCS, Wobbe, etc.) están en el PD-01 de la NGTS
        (ver fuente PD01). El RD 919/2006 se mantiene como contexto, no como
        origen de las cifras de calidad.

    - id: NGTS06
      tipo: norma_tecnica_sistema
      nombre: "NGTS-06 — Normas de Gestión Técnica del Sistema gasista"
      pais: España
      publicacion: "Aprobadas por Orden ITC/3126/2005, de 5 de octubre (BOE 15/10/2005), y modificaciones posteriores"
      ambito: >
        Normas de Gestión Técnica del Sistema gasista español. El detalle
        numérico de las especificaciones de calidad del gas se desarrolla en
        el Protocolo de Detalle PD-01 (ver fuente PD01).

    - id: PD01
      tipo: protocolo_detalle
      nombre: "PD-01 — Medición, Calidad y Odorización de Gas"
      pais: España
      publicacion: >
        Aprobado por Resolución DGPEM de 13/03/2006; redacción del apartado 5.2
        (Tabla 3) vigente según Resolución de 21/12/2012 (BOE-A-2013-185) y
        Resolución de 8/10/2018 (BOE-A-2018-14557).
      url_boe_2012: "https://www.boe.es/eli/es/res/2012/12/21/(3)"
      url_boe_2018: "https://www.boe.es/eli/es/res/2018/10/08/(3)"
      url_enagas: "https://www.enagas.es/es/gestion-tecnica-sistema/procesos-sistema-gasista/calidad-gas/"
      ambito: >
        Fuente PRIMARIA de las especificaciones numéricas de calidad del gas
        introducido en el Sistema Gasista español (apartado 5.2, Tabla 3):
        índice de Wobbe, PCS, densidad relativa, S total, H₂S+COS, RSH, O₂,
        CO₂, puntos de rocío. Condiciones de referencia de la tabla:
        [0 ºC, V(0 ºC, 1,01325 bar)].

    - id: NC_INT
      tipo: reglamento_europeo
      nombre: "Network Code on Interoperability and Data Exchange (NC INT)"
      referencia_legal: "Reglamento (UE) 2015/703 de la Comisión"
      publicacion: "DOUE L 113, de 1 de mayo de 2015"
      url_eurlex: "https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32015R0703"
      ambito: >
        Código de red sobre interoperabilidad e intercambio de datos.
        Contiene las disposiciones de calidad del gas aplicables a los
        puntos de interconexión entre redes de transporte de la UE,
        incluyendo monitorización de Wobbe/GCV.

    - id: NC_CAM
      tipo: reglamento_europeo
      nombre: "Network Code on Capacity Allocation Mechanisms (NC CAM)"
      referencia_legal: "Reglamento (UE) 2017/459 de la Comisión"
      publicacion: "DOUE L 72, de 17 de marzo de 2017"
      url_eurlex: "https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32017R0459"
      ambito: >
        Mecanismos de asignación de capacidad en redes de transporte de gas.
        Referenciado en el enunciado como "INT/CAM".

    - id: EASEE_GAS
      tipo: buenas_practicas
      nombre: "EASEE-gas Common Business Practices (CBP)"
      ambito: >
        Recomendaciones de armonización de calidad del gas en Europa.
        No son vinculantes pero son referencia habitual en puntos de
        interconexión transfronteriza. Consultar CBP 2005-001/002.

    - id: EN_ISO_6976
      tipo: norma_tecnica
      nombre: "EN ISO 6976 — Cálculo de poder calorífico, densidad e índice de Wobbe"
      ambito: >
        Define los métodos de cálculo y las condiciones de referencia estándar
        para PCS/PCI a partir de la composición del gas. Imprescindible para
        interpretar los valores de PCS con sus condiciones de referencia correctas.


# =============================================================================
# PARÁMETROS DE CALIDAD
# =============================================================================

parametros:

  # ---------------------------------------------------------------------------
  O2:
  # ---------------------------------------------------------------------------
    nombre_completo: Oxígeno
    simbolo: "O₂"
    nombre_ingles: Oxygen
    tipo: contaminante
    motivacion_limite: >
      El oxígeno degrada la calidad del gas, favorece la corrosión en tuberías
      y puede comprometer la seguridad en almacenamiento subterráneo.
    aliases:
      - oxígeno
      - contenido de oxígeno
      - oxygen
      - oxygen content
      - O2
      - O₂

    limites:
      ES:
        fuente: PD01
        fuente_secundaria: NGTS06
        articulo: "PD-01, apartado 5.2, Tabla 3 (Especificaciones de calidad del gas introducido en el Sistema Gasista)"
        fuente_url: "https://www.enagas.es/es/gestion-tecnica-sistema/procesos-sistema-gasista/calidad-gas/"
        tipo_limite: maximo
        valor: 0.01
        unidad: pct_mol
        expresion_original: "0,01 % mol (máximo)"
        condiciones_referencia:
          temperatura_combustion_C: null   # no aplica: fracción molar
          temperatura_volumen_C: 0
          presion_bar: 1.01325
        estado_verificacion: VERIFICADO
        nota: >
          Confirmado en PD-01 Tabla 3: O₂ ≤ 0,01 % mol. La tabla expresa la
          fracción como molar (% mol), no volumétrica; para gas ideal % mol ≈ % vol.

      UE:
        fuente: NC_INT
        articulo: "Reglamento (UE) 2015/703 — no fija límite de O₂"
        fuente_url: "https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32015R0703"
        tipo_limite: maximo
        valor: null
        unidad: null
        expresion_original: "no establecido por el Reglamento (UE) 2015/703"
        condiciones_referencia:
          temperatura_combustion_C: null
          temperatura_volumen_C: null
          presion_bar: null
        estado_verificacion: NO_VERIFICABLE_SIN_FUENTE
        nota: >
          El Reglamento (UE) 2015/703 (NC INT) NO contiene un límite numérico de
          O₂. Sólo armoniza unidades, condiciones de referencia y la obligación de
          publicar/monitorizar índice de Wobbe y PCS. Los límites de O₂ se dejan a
          la normativa nacional / acuerdos bilaterales entre TSOs (y, como
          referencia técnica no vinculante, a la norma EN 16726). No se puede
          escribir un valor numérico UE sin inventarlo.

    conversion:
      par: [pct_vol, pct_mol]
      equivalencia_gas_ideal: >
        Para gas natural en condiciones normales, % vol ≈ % mol (diferencia < 0,1 %).
        La distinción es formal; en la práctica se tratan como equivalentes.
      par_2: [pct_vol, ppm_vol]
      formula_pct_a_ppm: "ppm_vol = pct_vol * 10000"
      formula_ppm_a_pct: "pct_vol = ppm_vol / 10000"
      ejemplo: "0,01 % = 100 ppm(vol)"

    flag_comparabilidad: NO_COMPARABLE
    comparabilidad:
      estado: NO_COMPARABLE
      icono: "🔴"
      requiere_conversion: false
      conversion_exacta: false
      resultado: >
        No es posible comparar O₂ entre ES y UE: España fija O₂ ≤ 0,01 % mol
        (PD-01 Tabla 3), pero el Reglamento (UE) 2015/703 no establece ningún
        límite numérico de O₂. La comparación queda 🔴 NO_COMPARABLE por falta
        de valor UE en la fuente normativa citada.
      condicion_alerta: >
        Si se incorpora una fuente UE con límite de O₂ (p.ej. EN 16726 o un
        acuerdo bilateral de interconexión), actualizar el valor UE y reevaluar.


  # ---------------------------------------------------------------------------
  H2S:
  # ---------------------------------------------------------------------------
    nombre_completo: Sulfuro de hidrógeno
    simbolo: "H₂S"
    nombre_ingles: Hydrogen sulphide
    masa_molar_g_mol: 34.08
    tipo: contaminante
    motivacion_limite: >
      Altamente tóxico (TLV-TWA 1 ppm), corrosivo para instalaciones metálicas
      y precursor de SO₂ en combustión. Parte del azufre total pero con
      parámetro propio por su toxicidad específica.
    aliases:
      - sulfuro de hidrógeno
      - H2S
      - H₂S
      - hydrogen sulphide
      - hydrogen sulfide
      - ácido sulfhídrico
      - sulfhídrico

    limites:
      ES:
        fuente: PD01
        fuente_secundaria: NGTS06
        articulo: "PD-01, apartado 5.2, Tabla 3 — fila «H₂S + COS (como S)»"
        fuente_url: "https://www.enagas.es/es/gestion-tecnica-sistema/procesos-sistema-gasista/calidad-gas/"
        tipo_limite: maximo
        valor: 15.0
        unidad: mg_per_nm3
        expresion_original: "H₂S + COS (como S) ≤ 15 mg/Nm³ (máximo)"
        parametro_exacto: "Suma de H₂S y COS, expresada como azufre (S)"
        condiciones_referencia:
          temperatura_volumen_C: 0        # Tabla 3: [0 ºC, V(0 ºC, 1,01325 bar)]
          presion_bar: 1.01325
        estado_verificacion: VERIFICADO
        nota_correccion: >
          ⚠ CORRECCIÓN: el valor anterior (5 mg/Nm³) era ERRÓNEO. El límite
          oficial de la Tabla 3 del PD-01 es 15 mg/Nm³ para «H₂S + COS (como S)».
          Parámetros relacionados de la misma tabla: Azufre total (S total)
          ≤ 50 mg/Nm³ y mercaptanos RSH (como S) ≤ 17 mg/Nm³.
        nota_unidad: >
          El límite es una concentración másica de AZUFRE (como S), suma de H₂S y
          COS, no de H₂S puro. La conversión a ppm(vol) de H₂S de la sección
          inferior es por tanto orientativa (asume H₂S puro con M=34,08 g/mol).
        nota_critica: >
          ⚠ CASO DE USO CLAVE: si el usuario proporciona un valor en mg/m³
          a 15 °C (m³ estándar), hay que renormalizar a Nm³ (0 °C) antes de
          comparar. Factor de corrección: valor_Nm3 = valor_15C * (288.15/273.15)
          ≈ valor_15C * 1.055. Ver sección normalizacion_condiciones_referencia.

      UE:
        fuente: NC_INT
        articulo: "Reglamento (UE) 2015/703 — no fija límite de H₂S"
        fuente_url: "https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32015R0703"
        tipo_limite: maximo
        valor: null
        unidad: null
        expresion_original: "no establecido por el Reglamento (UE) 2015/703"
        condiciones_referencia:
          temperatura_volumen_C: null
          presion_bar: null
        estado_verificacion: NO_VERIFICABLE_SIN_FUENTE
        nota: >
          El Reglamento (UE) 2015/703 (NC INT) NO fija un límite numérico de H₂S
          (ni en mg/m³ ni en ppm). Los límites de H₂S/azufre en interconexión se
          dejan a la normativa nacional / acuerdos bilaterales entre TSOs, y como
          referencia técnica no vinculante a la norma EN 16726. El valor anterior
          (5 mg/Nm³, «o 3,5 ppm / 6,5 mg/m³») no procedía de esta fuente y se
          retira para no inventar una cifra.

    conversion:
      tipo: masa_molar
      formula_mg_nm3_a_ppm_vol: >
        ppm_vol = (mg/Nm³ × 22.414) / masa_molar_g_mol
        ppm_vol = (mg/Nm³ × 22.414) / 34.08
        ppm_vol = mg/Nm³ × 0.6577
      formula_ppm_vol_a_mg_nm3: >
        mg/Nm³ = ppm_vol × masa_molar_g_mol / 22.414
        mg/Nm³ = ppm_vol × 34.08 / 22.414
        mg/Nm³ = ppm_vol × 1.5196
      factor_mg_nm3_a_ppm: 0.6577
      factor_ppm_a_mg_nm3: 1.5196
      condiciones_validas: "T = 0 °C, P = 1,01325 bar (Nm³)"
      ejemplo: "15 mg/Nm³ × 0,6577 = 9,87 ppm(vol)  (asumiendo H₂S puro, M=34,08)"
      nota_como_S: >
        El límite ES está expresado «como S» (M_S = 32,06 g/mol). Si se quiere el
        equivalente en ppm(vol) de azufre: 15 mg-S/Nm³ × 22,414 / 32,06 ≈ 10,49 ppm.
        El factor 0,6577 aplica a H₂S puro; usarlo sólo cuando el dato sea H₂S.
      volumen_molar_nm3_kmol: 22.414   # volumen molar gas ideal a 0°C, 1 atm

    normalizacion_condiciones_referencia:
      descripcion: >
        Si el valor del usuario está en mg/m³ a 15 °C, convertir a mg/Nm³
        antes de comparar con el límite ES (expresado a 0 °C).
      formula: "valor_Nm3 = valor_15C × (273.15 + 15) / 273.15 = valor_15C × 1.0549"
      ejemplo: "12 mg/m³ @ 15°C → 12 × 1.0549 = 12.66 mg/Nm³"
      flag_si_condiciones_no_especificadas: NO_COMPARABLE

    flag_comparabilidad: NO_COMPARABLE
    comparabilidad:
      estado: NO_COMPARABLE
      icono: "🔴"
      requiere_conversion: false
      conversion_exacta: false
      resultado: >
        No es posible comparar H₂S entre ES y UE: España fija H₂S+COS (como S)
        ≤ 15 mg/Nm³ (PD-01 Tabla 3, @0 ºC), pero el Reglamento (UE) 2015/703 no
        establece límite numérico de H₂S. Falta valor UE en la fuente citada.
      condicion_flag_rojo: >
        Además, si las condiciones de referencia del volumen (0 °C vs 15 °C) del
        dato del usuario no están especificadas → 🔴 NO_COMPARABLE.
      nota: >
        Para comparar con la UE haría falta una fuente que sí fije el límite
        (EN 16726 o acuerdo bilateral de interconexión). No se inventa cifra UE.


  # ---------------------------------------------------------------------------
  PCS:
  # ---------------------------------------------------------------------------
    nombre_completo: Poder Calorífico Superior
    simbolo: PCS
    nombre_ingles: Gross Calorific Value (GCV)
    alias_ingles: HHV (Higher Heating Value)
    tipo: calidad_energetica
    descripcion: >
      Energía liberada en la combustión completa de una unidad de volumen de gas,
      incluyendo el calor de condensación del vapor de agua en los productos.
      Calculado según EN ISO 6976. Su valor depende CRÍTICAMENTE de las
      condiciones de referencia (temperatura de combustión / temperatura de
      medición del volumen). Sin especificar condiciones, el número es ambiguo.
    aliases:
      - poder calorífico superior
      - PCS
      - GCV
      - gross calorific value
      - valor calorífico superior
      - HHV
      - higher heating value
      - poder calorífico
    parametro_relacionado_no_incluido:
      - nombre: PCI (Poder Calorífico Inferior / NCV / LHV)
        nota: No es uno de los 3 parámetros del reto. No confundir con PCS.
      - nombre: Índice de Wobbe
        nota: >
          PCS / √(densidad relativa). Aparece en el NC INT como indicador de
          intercambiabilidad. No es uno de los 3 parámetros pero es contexto
          frecuente en preguntas sobre PCS.

    limites:
      ES:
        fuente: PD01
        fuente_secundaria: NGTS06
        articulo: "PD-01, apartado 5.2, Tabla 3 — fila «PCS»"
        fuente_url: "https://www.enagas.es/es/gestion-tecnica-sistema/procesos-sistema-gasista/calidad-gas/"
        tipo_limite: rango
        valor_min: 10.26
        valor_max: 13.26
        unidad: kWh_per_nm3
        expresion_original: "10,26 – 13,26 kWh/Nm³ (PD-01 Tabla 3)"
        equivalencia_MJ_per_nm3:
          valor_min: 36.94      # 10,26 kWh × 3,6
          valor_max: 47.74      # 13,26 kWh × 3,6
          nota: "Conversión exacta × 3,6 MJ/kWh"
        condiciones_referencia:
          norma_calculo: EN_ISO_6976
          temperatura_combustion_C: 0
          temperatura_volumen_C: 0
          presion_bar: 1.01325
          notacion: "@0/0"
          cita_condiciones: "PD-01: Hs[t1,p1,V(t2,p2)] en [0 ºC, V(0 ºC, 1,01325 bar)]"
        estado_verificacion: VERIFICADO
        nota_correccion: >
          ⚠ CORRECCIÓN DOBLE: (1) el rango anterior (34,12 – 38,77 MJ/Nm³) era
          ERRÓNEO; el oficial de la Tabla 3 del PD-01 es 10,26 – 13,26 kWh/Nm³
          (= 36,94 – 47,74 MJ/Nm³). (2) Las condiciones de referencia anteriores
          (@25/0) también eran erróneas: el PD-01 fija el PCS en base
          volumétrica a [0 ºC combustión, V(0 ºC, 1,01325 bar)], es decir @0/0.
        nota_critica: >
          ⚠ CONDICIONES DE REFERENCIA CRÍTICAS: España (PD-01) usa @0/0
          (combustión 0 °C, volumen 0 °C). El Reglamento (UE) 2015/703 reporta
          el PCS a @25/0 (combustión 25 °C por defecto, volumen 0 °C). El volumen
          de referencia coincide (0 °C); difiere la temperatura de combustión.
          Factor de conversión de PCS @25/0 → @0/0 = 1,0026 (Anexo del Reglamento
          2015/703, basado en EN ISO 13443).

      UE:
        fuente: NC_INT
        articulo: "Reglamento (UE) 2015/703, art. 13 (unidades y condiciones de referencia) y art. 16 (monitorización)"
        fuente_url: "https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32015R0703"
        tipo_limite: rango
        valor_min: null
        valor_max: null
        unidad: kWh_per_nm3
        expresion_original: "el Reglamento (UE) 2015/703 NO fija un rango numérico de PCS"
        condiciones_referencia:
          norma_calculo: EN_ISO_6976
          temperatura_combustion_C: 25    # art. 13: combustión por defecto 25 °C
          temperatura_volumen_C: 0         # art. 13: volumen 0 °C, 1,01325 bar(a)
          presion_bar: 1.01325
          notacion: "@25/0 (sólo condiciones de reporte; sin valores límite)"
        estado_verificacion: NO_VERIFICABLE_SIN_FUENTE
        nota: >
          El Reglamento (UE) 2015/703 NO establece un rango/límite numérico de PCS.
          Lo que sí fija (art. 13) son la unidad (kWh/m³, en función del PCS) y las
          condiciones de referencia (volumen 0 °C y 1,01325 bar; combustión por
          defecto 25 °C), y (art. 16) la obligación de los TSO de publicar Wobbe y
          PCS por hora en cada punto de interconexión. Los rangos de calidad se
          dejan a acuerdos bilaterales entre TSOs / normativa nacional (y, como
          referencia no vinculante, EN 16726). El rango anterior (30,2 – 47,2)
          era orientativo y NO procedía de esta norma; se retira.

    conversion:
      MJ_a_kWh:
        formula: "kWh/Nm³ = MJ/Nm³ / 3.6"
        formula_inversa: "MJ/Nm³ = kWh/Nm³ × 3.6"
        factor: 0.27778
        ejemplo: "36 MJ/Nm³ = 10 kWh/Nm³"
      correccion_condiciones_referencia:
        descripcion: >
          ES (PD-01) expresa el PCS a @0/0 (combustión 0 °C, volumen 0 °C).
          El Reglamento (UE) 2015/703 reporta a @25/0 (combustión 25 °C por
          defecto, volumen 0 °C). El volumen de referencia COINCIDE (0 °C); sólo
          difiere la temperatura de combustión, lo que produce una diferencia
          pequeña en el PCS por unidad de volumen.
        formula: "PCS@0/0 [kWh/Nm³] = PCS@25/0 [kWh/Nm³] × 1,0026"
        factor_25_0_a_0_0: 1.0026
        fuente_factor: "Anexo del Reglamento (UE) 2015/703 (PCS real por volumen), basado en EN ISO 13443"
        nota: >
          Factores adicionales del mismo Anexo (PCS real por volumen):
          25/20→25/0 = 1,0738 ; 25/0→15/15 = 0,9486 ; 15/15→0/0 = 1,0570.
          El factor 25/0→0/0 = 1,0026 se deriva de la propia tabla del Anexo.
          Sin condiciones de referencia confirmadas en alguna fuente → 🔴 NO_COMPARABLE.

    flag_comparabilidad: NO_COMPARABLE
    comparabilidad:
      estado: NO_COMPARABLE
      icono: "🔴"
      requiere_conversion: false
      conversion_exacta: false
      resultado: >
        No hay rango UE numérico con el que comparar: el Reglamento (UE) 2015/703
        no fija un rango de PCS, sólo unidades y condiciones de referencia
        (@25/0) y la obligación de monitorizar Wobbe/PCS. España fija
        10,26 – 13,26 kWh/Nm³ @0/0 (PD-01 Tabla 3). Comparación de RANGOS → 🔴.
      condicion_flag_verde: >
        Sólo si se incorpora una fuente UE con rango de PCS expresado en las
        mismas condiciones @T_comb/T_vol confirmadas.
      condicion_flag_amarillo: >
        Si la fuente UE da un rango en condiciones distintas pero existe el factor
        determinista (p.ej. @25/0 → @0/0 = 1,0026), se aplica y se muestra.
      condicion_flag_rojo: >
        Estado actual: no hay valores UE en la norma citada, o las condiciones de
        referencia no están especificadas. No se inventa ningún número.
      nota_presentacion: >
        Este es el parámetro más delicado del reto. Dos avisos clave: (1) las
        condiciones de referencia ES (@0/0) y de reporte UE (@25/0) difieren en
        la temperatura de combustión; (2) la UE no fija un rango numérico de PCS.
        Detectar ambas cosas es el valor diferencial frente al jurado.


# =============================================================================
# UNIDADES
# =============================================================================

unidades:

  pct_vol:
    simbolo: "% (vol)"
    tipo: fraccion_volumetrica
    descripcion: Fracción volumétrica en tanto por ciento
    equivalencia_ppm: "1 % vol = 10.000 ppm vol"

  pct_mol:
    simbolo: "% mol"
    tipo: fraccion_molar
    descripcion: Fracción molar en tanto por ciento
    nota: "Para gas natural a condiciones normales, % mol ≈ % vol (diferencia < 0,1 %)"

  ppm_vol:
    simbolo: "ppm(vol)"
    alias: "μmol/mol (gas ideal)"
    tipo: fraccion_volumetrica
    descripcion: Partes por millón en volumen

  ppm_mol:
    simbolo: "ppm(mol)"
    tipo: fraccion_molar
    descripcion: Partes por millón en fracción molar
    nota: "Para gas ideal, ppm mol ≈ ppm vol"

  mg_per_nm3:
    simbolo: "mg/Nm³"
    tipo: concentracion_masica
    descripcion: Miligramos por metro cúbico normal
    condiciones_normales:
      temperatura_C: 0
      presion_bar: 1.01325
    distincion_critica: >
      Nm³ (0 °C) ≠ m³ estándar (15 °C). Un valor en mg/m³ @ 15°C debe
      corregirse por el cociente de temperaturas antes de comparar con
      un límite expresado en mg/Nm³.

  mg_per_sm3:
    simbolo: "mg/m³ (@ 15°C)"
    tipo: concentracion_masica
    descripcion: Miligramos por metro cúbico estándar (15 °C, 1,01325 bar)
    condiciones:
      temperatura_C: 15
      presion_bar: 1.01325
    conversion_a_nm3: "valor_Nm3 = valor_sm3 × (288.15 / 273.15) ≈ valor_sm3 × 1.0549"

  MJ_per_nm3:
    simbolo: "MJ/Nm³"
    tipo: densidad_energetica
    descripcion: Megajulios por metro cúbico normal (0 °C, 1,01325 bar)

  kWh_per_nm3:
    simbolo: "kWh/Nm³"
    tipo: densidad_energetica
    descripcion: Kilovatios-hora por metro cúbico normal
    conversion: "1 MJ/Nm³ = 1/3,6 kWh/Nm³ ≈ 0,2778 kWh/Nm³"

  MJ_per_sm3:
    simbolo: "MJ/sm³  (@25/15)"
    tipo: densidad_energetica
    descripcion: Megajulios por metro cúbico estándar (15 °C). Usado en algunas normas UE.
    conversion_a_nm3: "PCS[MJ/Nm³] = PCS[MJ/sm³] × (273.15/288.15) ≈ PCS[MJ/sm³] × 0.9479"


# =============================================================================
# FLAGS DE COMPARABILIDAD
# =============================================================================

flags:

  COMPARABLE:
    icono: "🟢"
    descripcion: >
      Misma unidad y mismas condiciones de referencia (o conversión exacta
      ya aplicada). La comparación directa es válida.
    accion: Mostrar comparación directa con trazabilidad a fuente.

  COMPARABLE_TRAS_NORMALIZAR:
    icono: "🟡"
    descripcion: >
      Unidades o condiciones de referencia distintas, pero existe una
      conversión determinista verificada. Se aplica el factor de normalización
      y se muestra el valor equivalente con el factor explícito.
    accion: >
      Aplicar conversión, mostrar valor normalizado, indicar factor usado
      y las condiciones de referencia de partida y llegada.

  NO_COMPARABLE:
    icono: "🔴"
    descripcion: >
      No es posible comparar porque falta información (condiciones de referencia
      no especificadas en la fuente) o no existe conversión válida.
      No se inventa ningún número equivalente.
    accion: >
      Explicar explícitamente por qué no es comparable. Indicar qué información
      adicional sería necesaria para poder realizar la comparación.
    ejemplos_de_activacion:
      - "Valor de PCS del usuario sin especificar condiciones de referencia @T/T"
      - "Valor de H₂S en mg/m³ sin especificar si es a 0°C o 15°C"
      - "Artículo de la normativa que no especifica la condición de volumen"

  NO_COMPARABLE_SIN_DATOS:
    icono: "🔴"
    descripcion: Falta el valor o la unidad del dato del usuario para poder comparar.
    accion: Solicitar al usuario el valor y la unidad con sus condiciones de referencia.

  UNIDADES_INCOMPATIBLES:
    icono: "🔴"
    descripcion: >
      Las magnitudes físicas no son convertibles entre sí
      (p.ej. comparar mg/Nm³ de O₂ con % de H₂S sin más datos).
    accion: Escalar notificación — requiere revisión experta o aclaración del usuario.


# =============================================================================
# MOTOR DE REGLAS Y ORQUESTADOR
# =============================================================================

orquestador:
  descripcion: >
    Componente que recibe la pregunta del usuario (en lenguaje natural) y decide
    qué rama del sistema activar. El LLM clasifica la intención; la lógica
    de negocio la ejecuta código determinista.

  clasificacion_preguntas:
    comparativa:
      descripcion: >
        La pregunta solicita comparar un parámetro entre ES y UE,
        o evaluar si un valor medido cumple la normativa.
      ejemplos:
        - "¿Cuál es el límite de H₂S en España y en la UE? ¿Son comparables?"
        - "Compara el rango de PCS entre ES y el Network Code."
        - "El gas tiene 12 mg/m³ de H₂S a 15°C, ¿cumple el límite español?"
      ruta: ontologia → normalizador → flag → LLM_redacta

    abierta:
      descripcion: >
        La pregunta solicita información sobre la normativa sin comparación
        directa de valores numéricos. Se resuelve por RAG.
      ejemplos:
        - "¿Qué dice la normativa española sobre el oxígeno?"
        - "¿Qué es el índice de Wobbe?"
        - "¿En qué artículo del RD 919 se regula el H₂S?"
      ruta: RAG (Vector DB + chunks PDF con metadatos) → LLM_redacta_con_cita

motor_reglas:
  descripcion: >
    Ejecuta el pipeline determinista para preguntas comparativas.
    Ningún paso invoca al LLM para obtener números; el LLM sólo redacta al final.

  pasos:
    "1_clasificar_pregunta":
      accion: LLM detecta si la pregunta es comparativa o abierta.
      salida: tipo_pregunta ∈ {comparativa, abierta}

    "2_identificar_parametro":
      accion: >
        Mapear la consulta al parámetro canónico (O2, H2S, PCS)
        usando la lista de aliases de la ontología + embedding semántico.
      salida: parametro_id ∈ {O2, H2S, PCS} o ERROR_PARAMETRO_NO_RECONOCIDO

    "3_recuperar_limites":
      accion: >
        Leer de la ontología los límites ES y UE para el parámetro identificado.
        NO se consulta al LLM para este paso.
      salida: limite_ES, limite_UE, condiciones_ES, condiciones_UE

    "4_extraer_valor_usuario":
      accion: >
        Si la pregunta incluye un valor medido, extraerlo junto con su unidad
        y condiciones de referencia. Si faltan condiciones → flag NO_COMPARABLE.
      salida: valor_usuario, unidad_usuario, condiciones_usuario

    "5_normalizar_unidades":
      accion: >
        Convertir todos los valores (límite ES, límite UE, valor usuario si existe)
        a la unidad base del parámetro usando la tabla de conversiones y los
        factores de corrección de condiciones de referencia.
      herramienta_recomendada: pint (Python library para unidades)
      salida: valores_normalizados, factor_aplicado, unidad_base

    "6_evaluar_comparabilidad":
      accion: >
        Determinar si la comparación es válida según las reglas de la ontología.
        Asignar flag: 🟢 COMPARABLE / 🟡 COMPARABLE_TRAS_NORMALIZAR / 🔴 NO_COMPARABLE
      salida: flag, razon_flag

    "7_evaluar_cumplimiento":
      accion: >
        Si hay valor de usuario, comparar contra límites normalizados.
        Emitir: CUMPLE_ES, CUMPLE_UE, INCUMPLE_ES, INCUMPLE_UE.
      salida: resultado_cumplimiento

    "8_generar_respuesta":
      accion: >
        Pasar al LLM: parámetro, límites con citas de artículo y fuente,
        valores normalizados, factor de conversión, flag y resultado de cumplimiento.
        El LLM redacta en lenguaje natural sin inventar ningún número.
      garantias:
        - Trazabilidad: toda cifra va acompañada del artículo y documento fuente.
        - Sin alucinación numérica: el LLM sólo recibe datos estructurados y redacta.
        - Flag explícito: la respuesta siempre incluye el icono y la explicación del flag.
        - Alerta de condiciones: si las condiciones de referencia son relevantes, se explicitan.


# =============================================================================
# ARQUITECTURA RAG (para preguntas abiertas)
# =============================================================================

rag:
  descripcion: >
    Motor de recuperación para preguntas abiertas sobre normativa.
    El LLM responde fundamentado en fragmentos recuperados de los PDFs,
    nunca de memoria. Toda afirmación va acompañada de cita por metadatos.

  fuentes_pdf:
    - id: RD919
      descripcion: "RD 919/2006 completo"
    - id: NGTS06
      descripcion: "NGTS-06 y sus Protocolos de Detalle (última versión BOE)"
    - id: NC_INT_2015_703
      descripcion: "Reglamento (UE) 2015/703 — NC INT completo"
    - id: NC_CAM_2017_459
      descripcion: "Reglamento (UE) 2017/459 — NC CAM (si contiene calidad)"
    - id: EASEE_CBP
      descripcion: "EASEE-gas CBP relevantes (2005-001/002)"

  chunking:
    estrategia: por_articulo_o_seccion
    tamano_aproximado_tokens: 400
    solapamiento_tokens: 50
    nota: >
      Preservar el número de artículo y sección en los metadatos de cada chunk.
      Es imprescindible para la trazabilidad verificable.

  metadatos_por_chunk:
    - documento_id       # ej. RD919, NC_INT
    - titulo_documento
    - articulo_o_seccion # ej. "Art. 43", "Anexo I, Tabla 1"
    - pagina
    - fecha_publicacion
    - url_fuente_oficial

  retrieval:
    metodo: similitud_coseno
    top_k: 5
    reranking: opcional_cross_encoder

  respuesta:
    formato: >
      Texto generado por LLM + cita inline: (Fuente: [documento_id], [artículo], p. [página])
    garantia: El LLM no responde sin fragmento recuperado de respaldo.


# =============================================================================
# GLOSARIO DE DOMINIO
# =============================================================================

glosario:

  PCS:
    definicion: >
      Energía liberada en la combustión completa de una unidad de gas,
      incluyendo el calor de condensación del agua de los productos.
      En inglés GCV (Gross Calorific Value) o HHV. Depende críticamente
      de las condiciones de referencia @T_combustión/T_volumen.

  PCI:
    definicion: >
      Como el PCS pero sin contar la condensación del agua (NCV / LHV).
      No es uno de los 3 parámetros del reto. No confundir con PCS.

  indice_wobbe:
    definicion: >
      PCS / √(densidad relativa). Indicador de intercambiabilidad del gas.
      Aparece en el NC INT. No es uno de los 3 parámetros del reto pero
      es contexto frecuente en preguntas sobre PCS.

  condiciones_referencia:
    definicion: >
      Par (temperatura de combustión, temperatura/presión del volumen) bajo el
      que se expresa un valor calorífico o de concentración.
      Notación estándar: @T_comb/T_vol, p.ej. @25/0.
      Sin especificarlas, un valor de PCS es ambiguo.

  Nm3:
    definicion: >
      Metro cúbico normal: volumen medido a 0 °C y 1,01325 bar.
      Distinto del m³ estándar (sm³) a 15 °C. La distinción es crítica
      para convertir mg/m³ y valores de PCS.

  sm3:
    definicion: >
      Metro cúbico estándar: volumen medido a 15 °C y 1,01325 bar.
      Usado en algunas normas europeas. 1 sm³ ≈ 1,0549 Nm³.

  ppm_vol:
    definicion: "Partes por millón en volumen (= μmol/mol para gas ideal)."

  EN_ISO_6976:
    definicion: >
      Norma de cálculo de poder calorífico, densidad e índice de Wobbe
      a partir de la composición. Define las condiciones de referencia estándar.

  NGTS:
    definicion: >
      Normas de Gestión Técnica del Sistema gasista español.
      La NGTS-06 cubre medición, calidad y odorización con los valores
      numéricos específicos de los límites.

  trazabilidad:
    definicion: >
      Capacidad de remontar cada afirmación de la respuesta hasta su origen
      exacto en el documento fuente (artículo, página, URL oficial).
      Requisito central del sistema.

  pint:
    definicion: >
      Librería de Python para manejar magnitudes con unidades y convertirlas
      de forma segura. Candidata para implementar la capa de normalización.

  streamlit:
    definicion: >
      Framework de Python para construir interfaces web con poco código.
      Candidato para la UI del prototipo.

