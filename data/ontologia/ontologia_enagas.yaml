      pdf: "data/raw/HU_Korm_19_2009_Anexo11.pdf"
      url: "https://fgsz.hu/file/documents/0/0394/19_2009_korm_rendelet_hatalyos_2018_02_01_tol.pdf"
      tabla_calidad: "Anexo 11 (gas 2H): «1. Égési jellemzők» Wobbe 45,66–54,76 y felső hőérték (PCS) 31,00–45,28 MJ/m³; «2. Szennyezőanyag» azufre total ≤100, H₂S ≤20, O₂ ≤0,2 % V/V; «3. Egyéb» contenido de agua ≤0,17 g/m³ y rocío de HC ≤4 ºC a 4 MPa. NO fija densidad, mercaptanos, CO₂ ni rocío de agua en ºC → NO_VERIFICABLE."
      condiciones_referencia: "ÜKSZ: Wobbe-szám y égéshő (PCS) referidos a 25/0 ºC; PCI a 15/15; «gáztechnikai normál köbméter» a 288,15 K (15 ºC) pero liquidación energética a 0 ºC; 1,01325 bar → Wobbe/PCS @25/0. Cálculo según MSZ ISO 6976"
      nota: "Gas 2H (gas H/alto metano). Valores LITERALES del PDF oficial del Decreto 19/2009 (Anexo 11, en data/raw), verificados verbatim. El valor concreto de Wobbe/hőérték dentro del rango se fija por contrato. Hungría regula el CONTENIDO de agua (≤0,17 g/m³), no un punto de rocío de agua en ºC; y fija H₂S solo (no la suma con COS). Densidad relativa, mercaptanos y CO₂ no figuran en el Anexo 11 → NO_VERIFICABLE."
      ambito: "Especificaciones de calidad del gas 2H en la red de transporte húngara (FGSZ)."

