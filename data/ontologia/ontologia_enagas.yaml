# =============================================================================
# ONTOLOGÍA DE CALIDAD DEL GAS NATURAL — ENAGÁS
# Comparación regulatoria multinacional (España · Portugal · Francia · UE)
# =============================================================================
#
# PROPÓSITO
# Esta ontología es la "fuente de verdad" determinista del sistema.
# El LLM nunca inventa números: todos los valores numéricos salen de aquí.
#
# ARQUITECTURA
# Pregunta → Orquestador → ¿Comparativa? → Ontología + Normalizador → Flag → LLM redacta
#                       → ¿Abierta?       → RAG (Vector DB + chunks PDF) → LLM con cita
#
# ESQUEMA MULTI-PAÍS × MULTI-PARÁMETRO (v3.1.0)
# parametros[<ID>].limites[<JURISDICCION>] con jurisdicciones abiertas (ES, PT, FR, UE).
#
# ESTADOS DE VERIFICACIÓN
#   VERIFICADO                → cifra contrastada verbatim contra su fuente oficial.
#   NO_VERIFICABLE_SIN_FUENTE → la fuente citada NO fija la cifra (no existe).
#   PENDIENTE_EXTRACCION      → la cifra existe pero aún no se ha extraído (queda null).
#
# COBERTURA ACTUAL (revisión 2026-06)
# ES: 10/10 parámetros VERIFICADOS contra la Orden TED/181/2025 (BOE-A-2025-3873),
#     Tabla 3 (apartado 2.5.2.1), págs. 26-27. Condiciones @0/0.
# PT: Regulamento 826/2023 (RQS, ERSE), art. 39.º; valores en Anexo I (pág. 144 del consolidado).
#     Fija Wobbe, densidad, S total, H₂S+COS, O₂ y rocío de agua (@25/0, MJ/m³).
#     NO fija PCS, mercaptanos RSH, CO₂ ni rocío de hidrocarburos del gas natural.
# FR: GRTgaz «Annexe 4 — méthane de synthèse pour injection» (@0/0, kWh/m³). Fija los
#     10 parámetros. La spec de distribución (GRDF, abril 2017) difiere en varios
#     valores (ver notas). UE: el Reglamento 2015/703 no fija límites de calidad.
#
# AVISO DE COMPARABILIDAD
# ES y FR(GRTgaz) expresan PCS/Wobbe en kWh/m³ @0/0 → comparables directamente.
# PT expresa Wobbe en MJ/m³ @25/0 → requiere normalización (unidad + Tª combustión).
# Los flags 🟢/🟡/🔴 los calcula el motor determinista en tiempo de consulta.
# =============================================================================

ontologia:
  version: "3.1.0"
  fecha_revision: "2026-06"
  descripcion: >
    Ontología determinista para comparar parámetros de calidad del gas natural entre
    España, Portugal, Francia y el marco europeo. Cubre los 10 parámetros del alcance
    (excluye Polvo/Partículas). Toda respuesta comparativa se genera a partir de esta
    ontología; el LLM nunca calcula ni infiere valores numéricos.

  # ---------------------------------------------------------------------------
  # JURISDICCIONES
  # ---------------------------------------------------------------------------
  jurisdicciones:
    - codigo: ES
      nombre: España
      nivel: 1
      fuente_principal: ORDEN_TED_181_2025
      condiciones_referencia_defecto: "@0/0 — combustión 0 ºC, volumen V(0 ºC, 1,01325 bar)"
    - codigo: PT
      nombre: Portugal
      nivel: 1
      fuente_principal: REG_PT_826_2023
      condiciones_referencia_defecto: "@25/0 — combustión 25 ºC (ISO 13443), volumen 0 ºC, 1,01325 bar; volumen en m³(n)"
    - codigo: FR
      nombre: Francia
      nivel: 1
      fuente_principal: FR_GRTGAZ
      condiciones_referencia_defecto: "@0/0 — combustión 0 ºC, 1,01325 bar; volumen m³(n)"
      nota: >
        Valores de la spec de transporte GRTgaz (Annexe 4, inyección de metano de
        síntesis). La distribución GRDF (abril 2017) fija algunos límites distintos
        para gas natural (p.ej. S total ≤ 150 mg/m³(n)) y para inyección (O₂ 15-40
        mg/m³(n)). El gas francés se distribuye en tipo H (alto PCS) y tipo B (bajo
        PCS); aquí se toma el tipo H como referencia y el tipo B se anota.
    - codigo: UE
      nombre: Marco Europeo Común
      nivel: 2
      fuente_principal: NC_INT
      condiciones_referencia_defecto: "@25/0 (sólo condiciones de reporte; sin límites numéricos)"
    # Nivel 3: añadir aquí nuevos códigos de país y su bloque de límites homólogo.

  estados_verificacion:
    VERIFICADO: Cifra contrastada verbatim contra su fuente oficial.
    NO_VERIFICABLE_SIN_FUENTE: La fuente citada no fija la cifra (no existe en ella).
    PENDIENTE_EXTRACCION: La cifra existe en el documento pero aún no se ha extraído.

  # ---------------------------------------------------------------------------
  # FUENTES NORMATIVAS
  # ---------------------------------------------------------------------------
  fuentes_normativas:

    # --- España ---
    - id: ORDEN_TED_181_2025
      tipo: norma_tecnica_sistema
      pais: ES
      nombre: "Orden TED/181/2025, de 13 de febrero — Normas de Gestión Técnica del Sistema Gasista"
      organismo: "Ministerio para la Transición Ecológica y el Reto Demográfico"
      publicacion: "BOE-A-2025-3873, BOE núm. 50, de 27 de febrero de 2025 (texto consolidado, últ. mod. 30/09/2025)"
      pdf: "data/raw/BOE-A-2025-3873-consolidado.pdf"
      url: "https://www.boe.es/buscar/pdf/2025/BOE-A-2025-3873-consolidado.pdf"
      tabla_calidad: "Apartado 2.5.2.1 «Especificaciones del gas natural», Tabla 3 (págs. 26-27)"
      condiciones_referencia: "[0 ºC, V(0 ºC, 1,01325 bar)] — nota (*) al pie de la Tabla 3"
      ambito: "Fuente PRIMARIA VIGENTE de las especificaciones numéricas de calidad del gas natural español."

    - id: RD919
      tipo: reglamento_nacional
      pais: ES
      nombre: "Real Decreto 919/2006, de 28 de julio"
      publicacion: "BOE-A-2006-15345, BOE núm. 211, de 4 de septiembre de 2006"
      pdf: "data/raw/BOE-A-2006-15345-consolidado.pdf"
      url: "https://www.boe.es/buscar/pdf/2006/BOE-A-2006-15345-consolidado.pdf"
      nota: "Distribución y utilización (ICG 01–11). Contexto; no contiene la tabla de calidad del transporte."

    # --- Portugal ---
    - id: REG_PT_826_2023
      tipo: reglamento_nacional
      pais: PT
      nombre: "Regulamento n.º 826/2023 — Regulamento da Qualidade de Serviço dos Setores Elétrico e do Gás (RQS)"
      organismo: "ERSE — Entidade Reguladora dos Serviços Energéticos"
      publicacion: "Diário da República, 2.ª série, N.º 146, de 28 de julho de 2023"
      pdf: "data/raw/regulacion_portugal_826-2023.pdf"
      url: "https://www.erse.pt/media/ws0j5wzg/rqs_regulamento-da-qualidade-de-servi%C3%A7o_consolidado.pdf"
      tabla_calidad: "Anexo I «Características do gás» (art. 39.º): valores en pág. 144 del PDF consolidado de ERSE (pág. 371 del Diário da República original N.º 146)"
      condiciones_referencia: "0 ºC, 1,01325 bar, combustión inicial 25 ºC (ISO 13443/96); volumen en m³(n)"
      nota: "Deroga el RQS n.º 406/2021. PCS, mercaptanos RSH, CO₂ y rocío de HC del gas natural NO se fijan numéricamente."

    # --- Francia ---
    - id: FR_GRTGAZ
      tipo: prescripcion_tecnica
      pais: FR
      nombre: "GRTgaz — Annexe 4: caractéristiques physico-chimiques du méthane de synthèse destiné à être injecté"
      organismo: "GRTgaz (gestor de transporte, Francia)"
      pdf: "data/raw/annexe-4-spec-grtgaz-methane-de-synthese-pour-injection.pdf"
      url: "https://www.natrangroupe.com/sites/default/files/2024-07/annexe-4-spec-grtgaz-methane-de-synthese-pour-injection.pdf"
      tabla_calidad: "Tabla «Prescriptions techniques» (pág. 1)"
      condiciones_referencia: "Combustión 0 ºC y 1,01325 bar; volumen m³(n)"
      nota: "Alcance: inyección de metano de síntesis en la red de transporte. Distingue gas tipo H y tipo B."

    - id: FR_GRDF
      tipo: prescripcion_tecnica
      pais: FR
      nombre: "GRDF — Prescriptions techniques du distributeur"
      organismo: "GRDF (Gaz Réseau Distribution France)"
      publicacion: "Abril 2017 (base reglamentaria: décret n.º 2016-348)"
      pdf: "data/raw/Prescriptions_techniques_GRDF.pdf"
      url: "https://projet-methanisation.grdf.fr/cms-assets/2019/07/Prescriptions_techniques_GRDF.pdf"
      tabla_calidad: "Tabla 5.1.1 (gas natural, pág. 9) y Tabla 5.1.2 (inyección de gases distintos del gas natural, págs. 10-11)"
      nota: "Spec de distribución. Difiere de GRTgaz: S total gas natural ≤ 150 mg/m³(n); O₂ inyección 15-40 mg/m³(n)."

    # --- Marco Europeo ---
    - id: NC_INT
      tipo: reglamento_europeo
      pais: UE
      nombre: "Network Code on Interoperability and Data Exchange (NC INT)"
      referencia_legal: "Reglamento (UE) 2015/703 de la Comisión"
      publicacion: "DOUE L 113, de 1 de mayo de 2015"
      pdf: "data/raw/CELEX_32015R0703_ES_TXT.pdf"
      url: "https://publications.europa.eu/resource/celex/32015R0703"
      ambito: "Armoniza unidades, condiciones de referencia y monitorización de Wobbe/PCS. NO fija límites numéricos de calidad."

    - id: NC_CAM
      tipo: reglamento_europeo
      pais: UE
      nombre: "Network Code on Capacity Allocation Mechanisms (NC CAM) — Reglamento (UE) 2017/459"
      pdf: "data/raw/CELEX_32017R0459_ES_TXT.pdf"
      url: "https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32017R0459"
      descarga_auto: false  # EUR-Lex no sirve el PDF ES por API (404); enlace de cita, descarga manual
      ambito: "Asignación de capacidad. No fija calidad."

    - id: EN_16726
      tipo: norma_tecnica
      pais: UE
      nombre: "EN 16726:2025 — Gas infrastructure - Quality of gas - Group H"
      organismo: "CEN — Comité Europeo de Normalización (TC 234 / WG 11)"
      publicacion: "Septiembre 2025 (aprobada 20-jul-2025; supersede EN 16726:2015+A1:2018, ya derogada)"
      pdf: "data/raw/EN16726-2025_CEN-ENTSOG.pdf"
      url: "https://www.entsog.eu/sites/default/files/2025-12/S1.1%20CEN%20-%20EN16726.pdf"
      tabla_calidad: "§5 (Wobbe entrada/salida, O₂, densidad, H₂) + Tabla 1. Condiciones del Wobbe: 15 ºC/15 ºC"
      nota: "Norma de PAGO (CEN/AENOR): valores principales (Wobbe, densidad, O₂) verificados en la presentación oficial CEN/ENTSOG (nov-2025); el resto, sin cambios desde 2015+A1:2018, de fuente secundaria. Aún NO publicada como UNE-EN: en España rige todavía la UNE-EN 16726:2016+A1:2019."
      ambito: "Norma europea armonizada de calidad de gas grupo H. Alineada con Directiva (UE) 2024/1788 y Reglamento (UE) 2024/1789."

    # --- Italia ---
    - id: NORM_IT_GAS
      tipo: regla_tecnica_nacional
      pais: IT
      nombre: "Qualità del gas naturale — DM 18 maggio 2018 (agg. DM 4 ottobre 2023), recepito nel Codice di Rete di Snam Rete Gas"
      organismo: "Ministero dello Sviluppo Economico / MASE — operatore: Snam Rete Gas S.p.A. (regolatore: ARERA)"
      publicacion: "DM 18/05/2018 (GU n. 129 del 6-6-2018), p.to 5.1 Tabella 1; Indice di Wobbe aggiornato a 47,31÷53 MJ/Sm³ dal DM 4 ottobre 2023 (GU n. 241 del 14-10-2023)"
      pdf: "data/raw/IT_Snam_Allegato_11A.pdf"
      url: "https://www.snam.it/content/dam/snam/pages-attachments/it/i-nostri-business/trasporto/documents/codice-di-rete-srg/allegato_11_A_RevLXXXV.pdf"
      tabla_calidad: "Snam Codice di Rete, Allegato 11/A (Specifica tecnica), §4.1–4.3; DM 18/05/2018 All. A, p.to 5.1, Tabella 1"
      condiciones_referencia: "Condizioni standard ISO 13443: 288,15 K (15 ºC) e 101,325 kPa; riferimento entalpico (combustione) 15 ºC → 15/15. Volume in Sm³ (15 ºC)"
      nota: "Gas naturale Gruppo H. Valores verificados directamente del PDF de Snam (Allegato 11/A, Rev. LXXXV). El DM 18/05/2018 oficial está escaneado; sus valores coinciden con el Codice di Rete vigente."
      ambito: "Fuente PRIMARIA de las especificaciones de calidad del gas natural en la red de transporte italiana (gruppo H)."

    # --- Alemania ---
    - id: DVGW_G260
      tipo: norma_tecnica
      pais: DE
      nombre: "DVGW Arbeitsblatt G 260 (2021) — Gasbeschaffenheit"
      organismo: "DVGW — Deutscher Verein des Gas- und Wasserfaches"
      publicacion: "Edición septiembre 2021"
      pdf: "data/raw/DE_GASCADE_Gasbeschaffenheit.pdf"
      url: "https://www.gascade.de/fileadmin/Dokumente/Netzzugang/Netzpunktlisten/GASCADE_Netzpunktliste_und_Gasbeschaffenheit_241008.pdf"
      tabla_calidad: "DVGW G 260:2021 (gas grupo H). Condiciones de referencia y Wobbe verificados en hoja de red GASCADE; azufre/H₂S+COS/CO₂/O₂/agua/rocío HC en el informe oficial DVGW G 202140 (Tabelle 5) y gwf-gas 2024"
      condiciones_referencia: "Combustión 25 ºC (298,15 K); volumen en Normbedingungen 0 ºC (273,15 K), 1,01325 bar → 25/0"
      nota: "Gas grupo H (2. Gasfamilie). Norma de PAGO: el rango de Brennwert (PCS) NO es público → NO_VERIFICABLE. La densidad se da por la clasificación de la 2ª familia EN 437 (0,55–0,75). Wobbe, azufre total, H₂S+COS, mercaptanos, CO₂, O₂, agua y rocío HC confirmados en publicaciones oficiales DVGW / alineados con EN 16726."
      ambito: "Norma técnica alemana de calidad del gas; referencia de la red de transporte (gruppo H)."

    # --- Países Bajos ---
    - id: NORM_NL_GAS
      tipo: regla_tecnica_nacional
      pais: NL
      nombre: "Especificaciones de calidad del gas H (Países Bajos) — Gasunie Transport Services (GTS), marco Energiewet (desde 1-1-2026)"
      organismo: "ACM (regulador) — operador: Gasunie Transport Services (GTS). Marco legal: Energiewet (sustituye a la Gaswet desde 1-1-2026)"
      publicacion: "Especificaciones de calidad de gas H publicadas por GTS (Gas quality and metering). Base técnica histórica: Regeling gaskwaliteit (BWBR0035367), Bijlagen 1/3, DEROGADA el 1-1-2026; sus valores siguen aplicándose operativamente vía GTS bajo la Energiewet."
      url: "https://www.gasunietransportservices.nl/en/connected-parties/gas-quality-and-metering"
      descarga_auto: false  # fuente HTML (no PDF); enlace de cita, descarga manual
      tabla_calidad: "GTS «Gas quality and metering» (gas H); base técnica: Regeling gaskwaliteit Bijlage 1 (entrada) y Bijlage 3 (salida)"
      condiciones_referencia: "Wobbe/PCS a verbrandingsreferentietemperatuur 298,15 K (25 ºC); volumen m³(n) a 273,15 K (0 ºC), 101,325 kPa → 25/0"
      nota: "Gas hoogcalorisch (H-gas). Regeling derogada el 1-1-2026 (Gaswet→Energiewet); valores técnicos vigentes vía GTS. Fija Wobbe, O₂, CO₂, azufre total y rocío de agua. El informe de verificación (deep-research) añade H₂S ≤5 y mercaptanos ≤6 (Bijlage 3), pero una lectura directa de la Regeling no los localizó para H-gas → PENDIENTE de re-confirmar. El HC se controla como CONDENSADO (≤5 mg/m³(n) a -3 ºC), no como °C de rocío; NO fija PCS ni densidad (→ NO_VERIFICABLE)."
      ambito: "Especificaciones de calidad del gas H en la red de transporte neerlandesa (GTS)."

    # --- Bélgica ---
    - id: NORM_BE_FLUXYS
      tipo: prescripcion_tecnica
      pais: BE
      nombre: "Fluxys Belgium — calidad del gas H: Access Code for Transmission (ACT), Attachment C.4; y Bijlage 7 del contrato de conexión"
      organismo: "Fluxys Belgium (operador de transporte) — regulador: CREG. Distribución: Synergrid"
      publicacion: "ACT, Attachment C.4 «Operating Conditions and Quality Requirements at Interconnection Points» (aprob. CREG); marco legal: Gas Act 12-abr-1965"
      pdf: "data/raw/BE_Fluxys_NaturalGasSpecs_H.pdf"
      url: "https://www.fluxys.com/-/media/project/fluxys/public/corporate/fluxyscom/documents/fluxys-belgium/commercial/dpeu-documents/bijlage-7-annexe-7-nlfr--v2.pdf"
      tabla_calidad: "Fluxys, ACT Attachment C.4 (gas H): Wobbe, PCS, azufre total, H₂S+COS, mercaptanos, O₂, CO₂, rocíos. La hoja Bijlage 7 del contrato de conexión da un subconjunto."
      condiciones_referencia: "Combustión 25 ºC; volumen m³(n) a 0 ºC, 101,325 kPa → 25/0 (Wobbe/PCS en kWh/m³(n))"
      nota: "Gas H (existe también gas L con conversión H↔L). Valores de Fluxys ACT Attachment C.4; varían ligeramente por punto de interconexión (se usan los predominantes). La densidad relativa NO se fija en la tabla → NO_VERIFICABLE."
      ambito: "Especificaciones de calidad del gas H en la red de transporte belga (Fluxys)."

    - id: EN_ISO_6976
      tipo: norma_tecnica
      pais: UE
      nombre: "EN ISO 6976 / ISO 13443 — Cálculo de poder calorífico, Wobbe y condiciones de referencia estándar"
      ambito: "Métodos de cálculo y condiciones de referencia estándar para PCS/Wobbe."


