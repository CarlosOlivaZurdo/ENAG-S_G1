    - id: EN_16726
      tipo: norma_tecnica
      pais: UE
      nombre: "EN 16726:2025 — Gas infrastructure - Quality of gas - Group H"
      organismo: "CEN — Comité Europeo de Normalización (TC 234 / WG 11)"
      publicacion: "Septiembre 2025 (aprobada 20-jul-2025; supersede EN 16726:2015+A1:2018, ya derogada)"
