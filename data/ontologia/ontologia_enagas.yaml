# =============================================================================
# ONTOLOGÍA DE CALIDAD DEL GAS NATURAL — ENAGÁS
# Comparación regulatoria multinacional (España · Portugal · Francia · UE)
# =============================================================================
#
# PROPÓSITO
# Esta ontología es la "fuente de verdad" determinista del sistema.
# El LLM nunca inventa números: todos los valores numéricos salen de aquí.
#
# ARQUITECTURA
# Pregunta → Orquestador → ¿Comparativa? → Ontología + Normalizador → Flag → LLM redacta
#                       → ¿Abierta?       → RAG (Vector DB + chunks PDF) → LLM con cita
#
# ESQUEMA MULTI-PAÍS × MULTI-PARÁMETRO (v3.1.0)
# parametros[<ID>].limites[<JURISDICCION>] con jurisdicciones abiertas (ES, PT, FR, UE).
#
# ESTADOS DE VERIFICACIÓN
#   VERIFICADO                → cifra contrastada verbatim contra su fuente oficial.
#   NO_VERIFICABLE_SIN_FUENTE → la fuente citada NO fija la cifra (no existe).
#   PENDIENTE_EXTRACCION      → la cifra existe pero aún no se ha extraído (queda null).
#
# COBERTURA ACTUAL (revisión 2026-06)
# ES: 10/10 parámetros VERIFICADOS contra la Orden TED/181/2025 (BOE-A-2025-3873),
#     Tabla 3 (apartado 2.5.2.1), págs. 26-27. Condiciones @0/0.
# PT: Regulamento 826/2023 (RQS, ERSE), Anexo I Secc. X, art. 39.º, pág. 371.
#     Fija Wobbe, densidad, S total, H₂S+COS, O₂ y rocío de agua (@25/0, MJ/m³).
#     NO fija PCS, mercaptanos RSH, CO₂ ni rocío de hidrocarburos del gas natural.
# FR: GRTgaz «Annexe 4 — méthane de synthèse pour injection» (@0/0, kWh/m³). Fija los
#     10 parámetros. La spec de distribución (GRDF, abril 2017) difiere en varios
#     valores (ver notas). UE: el Reglamento 2015/703 no fija límites de calidad.
#
# AVISO DE COMPARABILIDAD
# ES y FR(GRTgaz) expresan PCS/Wobbe en kWh/m³ @0/0 → comparables directamente.
# PT expresa Wobbe en MJ/m³ @25/0 → requiere normalización (unidad + Tª combustión).
# Los flags 🟢/🟡/🔴 los calcula el motor determinista en tiempo de consulta.
# =============================================================================

ontologia:
  version: "3.1.0"
  fecha_revision: "2026-06"
  descripcion: >
    Ontología determinista para comparar parámetros de calidad del gas natural entre
    España, Portugal, Francia y el marco europeo. Cubre los 10 parámetros del alcance
    (excluye Polvo/Partículas). Toda respuesta comparativa se genera a partir de esta
    ontología; el LLM nunca calcula ni infiere valores numéricos.

  # ---------------------------------------------------------------------------
  # JURISDICCIONES
  # ---------------------------------------------------------------------------
  jurisdicciones:
    - codigo: ES
      nombre: España
      nivel: 1
      fuente_principal: ORDEN_TED_181_2025
      condiciones_referencia_defecto: "@0/0 — combustión 0 ºC, volumen V(0 ºC, 1,01325 bar)"
    - codigo: PT
      nombre: Portugal
      nivel: 1
      fuente_principal: REG_PT_826_2023
      condiciones_referencia_defecto: "@25/0 — combustión 25 ºC (ISO 13443), volumen 0 ºC, 1,01325 bar; volumen en m³(n)"
    - codigo: FR
      nombre: Francia
      nivel: 1
      fuente_principal: FR_GRTGAZ
      condiciones_referencia_defecto: "@0/0 — combustión 0 ºC, 1,01325 bar; volumen m³(n)"
      nota: >
        Valores de la spec de transporte GRTgaz (Annexe 4, inyección de metano de
        síntesis). La distribución GRDF (abril 2017) fija algunos límites distintos
        para gas natural (p.ej. S total ≤ 150 mg/m³(n)) y para inyección (O₂ 15-40
        mg/m³(n)). El gas francés se distribuye en tipo H (alto PCS) y tipo B (bajo
        PCS); aquí se toma el tipo H como referencia y el tipo B se anota.
    - codigo: UE
      nombre: Marco Europeo Común
      nivel: 2
      fuente_principal: NC_INT
      condiciones_referencia_defecto: "@25/0 (sólo condiciones de reporte; sin límites numéricos)"
    # Nivel 3: añadir aquí nuevos códigos de país y su bloque de límites homólogo.

  estados_verificacion:
    VERIFICADO: Cifra contrastada verbatim contra su fuente oficial.
    NO_VERIFICABLE_SIN_FUENTE: La fuente citada no fija la cifra (no existe en ella).
    PENDIENTE_EXTRACCION: La cifra existe en el documento pero aún no se ha extraído.

  # ---------------------------------------------------------------------------
  # FUENTES NORMATIVAS
  # ---------------------------------------------------------------------------
  fuentes_normativas:

    # --- España ---
    - id: ORDEN_TED_181_2025
      tipo: norma_tecnica_sistema
      pais: ES
      nombre: "Orden TED/181/2025, de 13 de febrero — Normas de Gestión Técnica del Sistema Gasista"
      organismo: "Ministerio para la Transición Ecológica y el Reto Demográfico"
      publicacion: "BOE-A-2025-3873, BOE núm. 50, de 27 de febrero de 2025 (texto consolidado, últ. mod. 30/09/2025)"
      pdf: "data/raw/BOE-A-2025-3873-consolidado.pdf"
      tabla_calidad: "Apartado 2.5.2.1 «Especificaciones del gas natural», Tabla 3 (págs. 26-27)"
      condiciones_referencia: "[0 ºC, V(0 ºC, 1,01325 bar)] — nota (*) al pie de la Tabla 3"
      ambito: "Fuente PRIMARIA VIGENTE de las especificaciones numéricas de calidad del gas natural español."

    - id: PD01
      tipo: protocolo_detalle
      pais: ES
      nombre: "PD-01 — Medición, Calidad y Odorización de Gas (NGTS-06)"
      publicacion: "Redacción previa vía Resolución 21/12/2012 (BOE-A-2013-185) y 8/10/2018 (BOE-A-2018-14557)"
      url_enagas: "https://www.enagas.es/es/gestion-tecnica-sistema/procesos-sistema-gasista/calidad-gas/"
      ambito: "Fuente histórica de la Tabla 3 (apdo. 5.2). Mismos valores que la Orden TED/181/2025."

    - id: RD919
      tipo: reglamento_nacional
      pais: ES
      nombre: "Real Decreto 919/2006, de 28 de julio"
      publicacion: "BOE-A-2006-15345, BOE núm. 211, de 4 de septiembre de 2006"
      pdf: "data/raw/BOE-A-2006-15345-consolidado.pdf"
      nota: "Distribución y utilización (ICG 01–11). Contexto; no contiene la tabla de calidad del transporte."

    # --- Portugal ---
    - id: REG_PT_826_2023
      tipo: reglamento_nacional
      pais: PT
      nombre: "Regulamento n.º 826/2023 — Regulamento da Qualidade de Serviço dos Setores Elétrico e do Gás (RQS)"
      organismo: "ERSE — Entidade Reguladora dos Serviços Energéticos"
      publicacion: "Diário da República, 2.ª série, N.º 146, de 28 de julho de 2023"
      pdf: "data/raw/regulacion_portugal_826-2023.pdf"
      tabla_calidad: "Anexo I, Secção X «Características do gás (art. 39.º)», pág. 371"
      condiciones_referencia: "0 ºC, 1,01325 bar, combustión inicial 25 ºC (ISO 13443/96); volumen en m³(n)"
      nota: "Deroga el RQS n.º 406/2021. PCS, mercaptanos RSH, CO₂ y rocío de HC del gas natural NO se fijan numéricamente."

    # --- Francia ---
    - id: FR_GRTGAZ
      tipo: prescripcion_tecnica
      pais: FR
      nombre: "GRTgaz — Annexe 4: caractéristiques physico-chimiques du méthane de synthèse destiné à être injecté"
      organismo: "GRTgaz (gestor de transporte, Francia)"
      pdf: "data/raw/annexe-4-spec-grtgaz-methane-de-synthese-pour-injection.pdf"
      tabla_calidad: "Tabla «Prescriptions techniques» (pág. 1)"
      condiciones_referencia: "Combustión 0 ºC y 1,01325 bar; volumen m³(n)"
      nota: "Alcance: inyección de metano de síntesis en la red de transporte. Distingue gas tipo H y tipo B."

    - id: FR_GRDF
      tipo: prescripcion_tecnica
      pais: FR
      nombre: "GRDF — Prescriptions techniques du distributeur"
      organismo: "GRDF (Gaz Réseau Distribution France)"
      publicacion: "Abril 2017 (base reglamentaria: décret n.º 2016-348)"
      pdf: "data/raw/Prescriptions_techniques_GRDF.pdf"
      tabla_calidad: "Tabla 5.1.1 (gas natural, pág. 9) y Tabla 5.1.2 (inyección de gases distintos del gas natural, págs. 10-11)"
      nota: "Spec de distribución. Difiere de GRTgaz: S total gas natural ≤ 150 mg/m³(n); O₂ inyección 15-40 mg/m³(n)."

    # --- Marco Europeo ---
    - id: NC_INT
      tipo: reglamento_europeo
      pais: UE
      nombre: "Network Code on Interoperability and Data Exchange (NC INT)"
      referencia_legal: "Reglamento (UE) 2015/703 de la Comisión"
      publicacion: "DOUE L 113, de 1 de mayo de 2015"
      url_eurlex: "https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32015R0703"
      pdf: "data/raw/CELEX_32015R0703_ES_TXT.pdf"
      ambito: "Armoniza unidades, condiciones de referencia y monitorización de Wobbe/PCS. NO fija límites numéricos de calidad."

    - id: NC_CAM
      tipo: reglamento_europeo
      pais: UE
      nombre: "Network Code on Capacity Allocation Mechanisms (NC CAM) — Reglamento (UE) 2017/459"
      url_eurlex: "https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32017R0459"
      pdf: "data/raw/CELEX_32017R0459_ES_TXT.pdf"
      ambito: "Asignación de capacidad. No fija calidad."

    - id: EASEE_GAS
      tipo: buenas_practicas
      pais: UE
      nombre: "EASEE-gas CBP 2005-001/01 — Harmonisation of Natural Gas Quality"
      organismo: "EASEE-gas (European Association for the Streamlining of Energy Exchange-gas)"
      publicacion: "Common Business Practice nº 2005-001/01, aprobada 3-feb-2005, publicada 7-feb-2005 (revisión /02 posterior, borrador)"
      url_eurlex: "https://www.naesb.org/pdf2/wgq_bps100605w1.pdf"
      pdf: "data/raw/EASEE-gas_CBP_2005-001-01.pdf"
      tabla_calidad: "§4 «Parameter ranges and values». Condiciones: energía kWh con combustión 25 ºC; volumen m³ a 0 ºC, 1,01325 bar"
      ambito: "Recomendación de armonización de calidad para puntos transfronterizos de la UE (gas grupo H, sin odorizar). NO vinculante; base de la EN 16726."

    - id: EN_16726
      tipo: norma_tecnica
      pais: UE
      nombre: "EN 16726 — Calidad del gas, grupo H"
      ambito: "Referencia técnica no vinculante para límites de calidad en interconexión."

    - id: EN_ISO_6976
      tipo: norma_tecnica
      pais: UE
      nombre: "EN ISO 6976 / ISO 13443 — Cálculo de poder calorífico, Wobbe y condiciones de referencia estándar"
      ambito: "Métodos de cálculo y condiciones de referencia estándar para PCS/Wobbe."

  datasets_auxiliares:
    - id: NORM_17_06
      archivo: "data/raw/NORM_17_06.csv"
      nota: >
        Extracción previa de valores (ES/PT/FR). Usado como referencia cruzada; se han
        corregido sus errores contra los PDFs primarios (p.ej. PT O₂ ≤ 1 % mol — el CSV
        decía «no regulado»; PT rocío H₂O −8 ºC — el CSV decía −5; ES PCS máx 13,26 — el
        CSV decía 13,27).


# =============================================================================
# PARÁMETROS DE CALIDAD
# =============================================================================

parametros:

  # ---------------------------------------------------------------------------
  WOBBE:
  # ---------------------------------------------------------------------------
    nombre_completo: Índice de Wobbe
    simbolo: "IW"
    nombre_ingles: Wobbe Index
    grupo: energetico
    tipo: calidad_energetica
    definicion: "PCS / √(densidad relativa). Indicador de intercambiabilidad del gas."
    aliases: [índice de wobbe, wobbe, wobbe index, IW, WI]
    limites:
      ES:
        fuente: ORDEN_TED_181_2025
        articulo: "Tabla 3, apartado 2.5.2.1 (pág. 26)"
        tipo_limite: rango
        valor_min: 13.403
        valor_max: 16.058
        unidad: kWh_per_nm3
        expresion_original: "Índice de Wobbe: Mínimo 13,403 — Máximo 16,058 kWh/m³"
        condiciones_referencia: { temperatura_combustion_C: 0, temperatura_volumen_C: 0, presion_bar: 1.01325, notacion: "@0/0" }
        estado_verificacion: VERIFICADO
      PT:
        fuente: REG_PT_826_2023
        articulo: "Anexo I, Secção X, art. 39.º (pág. 371)"
        tipo_limite: rango
        valor_min: 48.17
        valor_max: 57.66
        unidad: MJ_per_nm3
        expresion_original: "IW: 48,17 — 57,66 MJ/m³(n)"
        condiciones_referencia: { temperatura_combustion_C: 25, temperatura_volumen_C: 0, presion_bar: 1.01325, notacion: "@25/0" }
        estado_verificacion: VERIFICADO
        nota_comparabilidad: "MJ/m³ @25/0. Frente a ES (kWh/m³ @0/0) requiere conversión de unidad y de Tª de combustión → 🟡."
      FR:
        fuente: FR_GRTGAZ
        articulo: "Annexe 4, tabla (pág. 1)"
        tipo_limite: rango
        valor_min: 13.64
        valor_max: 15.70
        unidad: kWh_per_nm3
        expresion_original: "Gaz de type H: 13,64 à 15,7 kWh/m³(n) (combustion 0 ºC, 1,01325 bar)"
        condiciones_referencia: { temperatura_combustion_C: 0, temperatura_volumen_C: 0, presion_bar: 1.01325, notacion: "@0/0" }
        estado_verificacion: VERIFICADO
        nota: "Gas tipo H. Gas tipo B: 12,50 – 13,06 kWh/m³(n) (GRDF gas B general: 12,01–13,06)."
      UE:
        fuente: EASEE_GAS
        articulo: "CBP 2005-001/01, §4 (tabla de rangos)"
        tipo_limite: rango
        valor_min: 13.60
        valor_max: 15.81
        unidad: kWh_per_nm3
        condiciones_referencia: { temperatura_combustion_C: 25, temperatura_volumen_C: 0, presion_bar: 1.01325, notacion: "@25/0" }
        expresion_original: "WI: 13,60 — 15,81 kWh/m³ (combustión 25 ºC, volumen 0 ºC)"
        estado_verificacion: VERIFICADO
        nota: "Recomendación EASEE-gas (no vinculante). Arranque de implantación con mínimo 13,76. Condiciones 25/0 → requiere ISO 13443 para comparar con España (0/0)."

  # ---------------------------------------------------------------------------
  PCS:
  # ---------------------------------------------------------------------------
    nombre_completo: Poder Calorífico Superior
    simbolo: PCS
    nombre_ingles: Gross Calorific Value (GCV)
    alias_ingles: HHV
    grupo: energetico
    tipo: calidad_energetica
    descripcion: >
      Energía de combustión completa por unidad de volumen, incluyendo la condensación
      del agua. Calculado según EN ISO 6976. Depende de las condiciones @T_comb/T_vol.
    aliases: [poder calorífico superior, PCS, GCV, gross calorific value, HHV, pouvoir calorifique supérieur]
    parametro_relacionado_no_incluido:
      - { nombre: "PCI (NCV/LHV)", nota: "Sin condensación de agua. No confundir con PCS." }
    limites:
      ES:
        fuente: ORDEN_TED_181_2025
        articulo: "Tabla 3, apartado 2.5.2.1 (pág. 26)"
        tipo_limite: rango
        valor_min: 10.26
        valor_max: 13.26
        unidad: kWh_per_nm3
        expresion_original: "PCS: Mínimo 10,26 — Máximo 13,26 kWh/m³"
        equivalencia_MJ_per_nm3: { valor_min: 36.94, valor_max: 47.74, nota: "× 3,6 MJ/kWh" }
        condiciones_referencia: { norma_calculo: EN_ISO_6976, temperatura_combustion_C: 0, temperatura_volumen_C: 0, presion_bar: 1.01325, notacion: "@0/0" }
        estado_verificacion: VERIFICADO
      PT:
        fuente: REG_PT_826_2023
        articulo: "Anexo I, Secção X, art. 39.º (pág. 371)"
        tipo_limite: rango
        valor_min: null
        valor_max: null
        unidad: null
        expresion_original: "El Regulamento 826/2023 NO fija rango numérico de PCS del gas natural (se controla vía índice de Wobbe)"
        estado_verificacion: NO_VERIFICABLE_SIN_FUENTE
      FR:
        fuente: FR_GRTGAZ
        articulo: "Annexe 4, tabla (pág. 1)"
        tipo_limite: rango
        valor_min: 10.7
        valor_max: 12.8
        unidad: kWh_per_nm3
        expresion_original: "Gaz de type H: 10,7 à 12,8 kWh/m³(n) (combustion 0 ºC, 1,01325 bar)"
        condiciones_referencia: { norma_calculo: EN_ISO_6976, temperatura_combustion_C: 0, temperatura_volumen_C: 0, presion_bar: 1.01325, notacion: "@0/0" }
        estado_verificacion: VERIFICADO
        nota: "Gas tipo H. Gas tipo B: 9,5 – 10,5 kWh/m³(n) (idéntico en GRDF y GRTgaz)."
        nota_comparabilidad: "Misma unidad (kWh/m³) y condiciones (@0/0) que ES → comparable directamente con el motor."
      UE:
        fuente: EASEE_GAS
        articulo: "CBP 2005-001/01, §4 (GCV solo para facturación)"
        tipo_limite: rango
        valor_min: null
        valor_max: null
        unidad: kWh_per_nm3
        expresion_original: "El CBP EASEE-gas NO fija rango de PCS: solo retiene Wobbe y densidad (el PCS/GCV queda para facturación)"
        condiciones_referencia: { temperatura_combustion_C: 25, temperatura_volumen_C: 0, presion_bar: 1.01325, notacion: "@25/0" }
        estado_verificacion: NO_VERIFICABLE_SIN_FUENTE
    conversion:
      MJ_a_kWh: { formula: "kWh/Nm³ = MJ/Nm³ / 3.6", factor: 0.27778 }
      correccion_condiciones_referencia:
        formula: "PCS@0/0 = PCS@25/0 × 1,0026"
        factor_25_0_a_0_0: 1.0026
        fuente_factor: "Anexo Reglamento (UE) 2015/703, basado en EN ISO 13443"
        nota: "Sin condiciones de referencia confirmadas en la fuente → 🔴 NO_COMPARABLE."

  # ---------------------------------------------------------------------------
  DENS_REL:
  # ---------------------------------------------------------------------------
    nombre_completo: Densidad Relativa
    simbolo: "d"
    nombre_ingles: Relative density
    grupo: fisico
    tipo: propiedad_fisica
    definicion: "Densidad del gas respecto al aire en las mismas condiciones (adimensional)."
    aliases: [densidad relativa, relative density, densité relative, gravedad específica, d]
    limites:
